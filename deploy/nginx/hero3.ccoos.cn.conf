# 本文件把 hero3.ccoos.cn 绑定到 React web、GM 后台和统一 Hero3 API。
server {
    listen 80;
    listen [::]:80;
    server_name hero3.ccoos.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hero3.ccoos.cn;

    ssl_certificate /etc/nginx/ssl/hero3.ccoos.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/hero3.ccoos.cn/privkey.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    root /var/www/hero3/web;
    index index.html;
    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        alias /var/www/hero3/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/hero3.access.log;
    error_log /var/log/nginx/hero3.error.log;
}
