# 本文件把旧 mobilewlsg.ccoos.cn 永久跳转到新的 wlsg.ccoos.cn 入口。
server {
    listen 80;
    listen [::]:80;
    server_name mobilewlsg.ccoos.cn;
    return 301 https://wlsg.ccoos.cn$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mobilewlsg.ccoos.cn;

    ssl_certificate /etc/letsencrypt/live/mobilewlsg.ccoos.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mobilewlsg.ccoos.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://wlsg.ccoos.cn$request_uri;
}
