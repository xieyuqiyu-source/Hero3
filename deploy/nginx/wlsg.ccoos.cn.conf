# 本文件把 wlsg.ccoos.cn 绑定到 web-wlsg，并与 hero3.ccoos.cn 共用 Hero3 API。
server {
    listen 80;
    listen [::]:80;
    server_name wlsg.ccoos.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name wlsg.ccoos.cn;

    ssl_certificate /etc/letsencrypt/live/wlsg.ccoos.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wlsg.ccoos.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/hero3/web-wlsg;
    index index.html;
    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/wlsg.access.log;
    error_log /var/log/nginx/wlsg.error.log;
}
