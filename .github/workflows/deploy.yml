# Hero3 自动发布流程：Actions 只负责 SSH 调度，服务器通过本地代理拉取源码并本机构建部署。
name: Deploy Hero3

on:
  push:
    branches:
      - main-core
  workflow_dispatch:

concurrency:
  group: hero3-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy on server
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      HERO3_HEALTH_URL: https://hero3.ccoos.cn/healthz

    steps:
      - name: Configure SSH
        env:
          HERO3_SSH_HOST: ${{ secrets.HERO3_SSH_HOST }}
          HERO3_SSH_PORT: ${{ secrets.HERO3_SSH_PORT || '22' }}
          HERO3_SSH_PRIVATE_KEY: ${{ secrets.HERO3_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$HERO3_SSH_HOST"
          test -n "$HERO3_SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$HERO3_SSH_PRIVATE_KEY" > ~/.ssh/hero3_deploy_key
          chmod 600 ~/.ssh/hero3_deploy_key
          ssh-keyscan -T 10 -t ed25519 -p "$HERO3_SSH_PORT" -H "$HERO3_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          touch ~/.ssh/known_hosts

      - name: Build and deploy on server
        env:
          HERO3_REPOSITORY: ${{ github.repository }}
          HERO3_REF_NAME: ${{ github.ref_name }}
          HERO3_SHA: ${{ github.sha }}
          HERO3_SSH_HOST: ${{ secrets.HERO3_SSH_HOST }}
          HERO3_SSH_PORT: ${{ secrets.HERO3_SSH_PORT || '22' }}
          HERO3_SSH_USER: ${{ secrets.HERO3_SSH_USER }}
        run: |
          set -euo pipefail
          test -n "$HERO3_REPOSITORY"
          test -n "$HERO3_REF_NAME"
          test -n "$HERO3_SHA"
          test -n "$HERO3_SSH_USER"
          if [ "$HERO3_REF_NAME" != "main-core" ]; then
            echo "Production deploy only supports main-core, got $HERO3_REF_NAME"
            exit 1
          fi

          printf -v REMOTE_ENV 'HERO3_REPOSITORY=%q HERO3_REF_NAME=%q HERO3_SHA=%q' \
            "$HERO3_REPOSITORY" "$HERO3_REF_NAME" "$HERO3_SHA"

          timeout --kill-after=10s 2400s ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=12 \
            -i ~/.ssh/hero3_deploy_key \
            -p "$HERO3_SSH_PORT" \
            "$HERO3_SSH_USER@$HERO3_SSH_HOST" \
            "$REMOTE_ENV bash -s" <<'EOF'
          set -euo pipefail

          SOURCE_DIR="/opt/hero3/source"
          BUILD_DIR="/tmp/hero3-build.${HERO3_SHA}"
          STAMP="$(date +%Y%m%d%H%M%S)"
          GIT_PROXY="http://127.0.0.1:7890"

          log() {
            printf '\n[%s] %s\n' "$(date -Is)" "$*"
          }

          command -v corepack >/dev/null
          command -v flock >/dev/null
          command -v git >/dev/null
          command -v go >/dev/null
          command -v node >/dev/null
          command -v rsync >/dev/null
          command -v tar >/dev/null
          command -v timeout >/dev/null

          show_hero3_logs() {
            systemctl status hero3 --no-pager -l || true
            journalctl -u hero3 -n 120 --no-pager || true
          }

          fetch_source() {
            local auth_config
            auth_config="$(mktemp /tmp/hero3-git-auth.XXXXXX)"
            chmod 600 "$auth_config"
            {
              printf '[http]\n'
              printf '\tversion = HTTP/1.1\n'
              printf '[http "https://github.com/"]\n'
              printf '\tproxy = %s\n' "$GIT_PROXY"
            } > "$auth_config"
            trap 'rm -f "$auth_config"' RETURN
            for attempt in 1 2 3; do
              if timeout --kill-after=10s 180s git -C "$SOURCE_DIR" \
                -c "include.path=$auth_config" \
                fetch --force --prune origin "+refs/heads/${HERO3_REF_NAME}:refs/remotes/origin/${HERO3_REF_NAME}"; then
                return 0
              fi
              sleep $((attempt * 5))
            done
            return 1
          }

          exec 9>/tmp/hero3-deploy.lock
          if ! flock -n 9; then
            echo "Another Hero3 deployment is already running."
            exit 1
          fi

          mkdir -p /opt/hero3/backups /var/www/hero3/backups
          mkdir -p /opt/hero3/go/bin /opt/hero3/go/config /var/www/hero3/web /var/www/hero3/admin

          log "Preparing source checkout through local proxy"
          if [ -e "$SOURCE_DIR" ] && [ ! -d "$SOURCE_DIR/.git" ]; then
            mv "$SOURCE_DIR" "/opt/hero3/source.non-git.${STAMP}"
          fi
          if [ ! -d "$SOURCE_DIR/.git" ]; then
            mkdir -p "$SOURCE_DIR"
            git -C "$SOURCE_DIR" init
            git -C "$SOURCE_DIR" remote add origin "https://github.com/${HERO3_REPOSITORY}.git"
          else
            git -C "$SOURCE_DIR" remote set-url origin "https://github.com/${HERO3_REPOSITORY}.git"
          fi
          git config --global http.https://github.com.proxy "$GIT_PROXY"
          git config --global https.https://github.com.proxy "$GIT_PROXY"
          git config --global http.https://github.com.version HTTP/1.1

          fetch_source
          git -C "$SOURCE_DIR" cat-file -e "${HERO3_SHA}^{commit}"
          git -C "$SOURCE_DIR" checkout --force "$HERO3_SHA"
          git -C "$SOURCE_DIR" reset --hard "$HERO3_SHA"
          git -C "$SOURCE_DIR" clean -fd

          log "Building release on server"
          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR/go/bin" "$BUILD_DIR/go/config" "$BUILD_DIR/deploy"

          export GOTOOLCHAIN=auto
          cd "$SOURCE_DIR/go"
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o "$BUILD_DIR/go/bin/hero3-server" ./cmd/server
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o "$BUILD_DIR/go/bin/hero3-dbtool" ./cmd/dbtool
          rsync -a "$SOURCE_DIR/go/config/" "$BUILD_DIR/go/config/"

          corepack enable
          corepack prepare pnpm@10.24.0 --activate

          cd "$SOURCE_DIR/web"
          pnpm install --frozen-lockfile
          pnpm build
          mkdir -p "$BUILD_DIR/web"
          rsync -a "$SOURCE_DIR/web/dist/" "$BUILD_DIR/web/"

          cd "$SOURCE_DIR/admin"
          pnpm install --frozen-lockfile
          pnpm build
          mkdir -p "$BUILD_DIR/admin"
          rsync -a "$SOURCE_DIR/admin/dist/" "$BUILD_DIR/admin/"

          if [ -d "$SOURCE_DIR/deploy/systemd" ]; then
            mkdir -p "$BUILD_DIR/deploy/systemd"
            rsync -a "$SOURCE_DIR/deploy/systemd/" "$BUILD_DIR/deploy/systemd/"
          fi
          if [ -d "$SOURCE_DIR/deploy/journald" ]; then
            mkdir -p "$BUILD_DIR/deploy/journald"
            rsync -a "$SOURCE_DIR/deploy/journald/" "$BUILD_DIR/deploy/journald/"
          fi

          log "Backing up current release"
          if [ -f /opt/hero3/go/bin/hero3-server ]; then
            cp -a /opt/hero3/go/bin/hero3-server "/opt/hero3/backups/hero3-server.$STAMP"
          fi
          if [ -d /var/www/hero3/web ]; then
            tar -czf "/var/www/hero3/backups/web.$STAMP.tar.gz" -C /var/www/hero3 web
          fi
          if [ -d /var/www/hero3/admin ]; then
            tar -czf "/var/www/hero3/backups/admin.$STAMP.tar.gz" -C /var/www/hero3 admin
          fi

          log "Installing release"
          install -m 755 "$BUILD_DIR/go/bin/hero3-server" /opt/hero3/go/bin/hero3-server
          install -m 755 "$BUILD_DIR/go/bin/hero3-dbtool" /opt/hero3/go/bin/hero3-dbtool
          rsync -a --delete "$BUILD_DIR/go/config/" /opt/hero3/go/config/
          rsync -a --delete "$BUILD_DIR/web/" /var/www/hero3/web/
          rsync -a --delete "$BUILD_DIR/admin/" /var/www/hero3/admin/
          printf '%s %s\n' "${HERO3_SHA:0:7}" "deployed from ${HERO3_REF_NAME}" > /opt/hero3/RELEASE

          log "Running database migrations"
          HERO3_DATABASE_DSN="$(
            awk '
              BEGIN { found = 0; value = "" }
              found == 0 && /^HERO3_DATABASE_DSN=/ {
                found = 1
                value = substr($0, index($0, "=") + 1)
                sub(/\r$/, "", value)
              }
              found == 1 {
                while (value ~ /\\$/ && (getline next_line) > 0) {
                  sub(/\r$/, "", next_line)
                  sub(/\\$/, "", value)
                  value = value next_line
                }
                print value
                exit
              }
            ' /etc/hero3/hero3.env
          )"
          HERO3_DATABASE_DSN="${HERO3_DATABASE_DSN%\"}"
          HERO3_DATABASE_DSN="${HERO3_DATABASE_DSN#\"}"
          HERO3_DATABASE_DSN="${HERO3_DATABASE_DSN%\'}"
          HERO3_DATABASE_DSN="${HERO3_DATABASE_DSN#\'}"
          test -n "$HERO3_DATABASE_DSN"
          export HERO3_DATABASE_DSN
          cd /opt/hero3/go
          timeout --kill-after=10s 120s /opt/hero3/go/bin/hero3-dbtool migrate

          log "Restarting services"
          if [ -d "$BUILD_DIR/deploy/journald" ]; then
            mkdir -p /etc/systemd/journald.conf.d /var/log/journal
            install -m 644 "$BUILD_DIR/deploy/journald/hero3-retention.conf" /etc/systemd/journald.conf.d/hero3-retention.conf
            systemd-tmpfiles --create --prefix /var/log/journal || true
            timeout --kill-after=10s 30s systemctl restart systemd-journald || true
          fi
          if [ -d "$BUILD_DIR/deploy/systemd" ]; then
            install -m 644 "$BUILD_DIR/deploy/systemd/hero3-battle-report-cleanup.service" /etc/systemd/system/hero3-battle-report-cleanup.service
            install -m 644 "$BUILD_DIR/deploy/systemd/hero3-battle-report-cleanup.timer" /etc/systemd/system/hero3-battle-report-cleanup.timer
            install -m 644 "$BUILD_DIR/deploy/systemd/hero3-maintenance-status.service" /etc/systemd/system/hero3-maintenance-status.service
            install -m 644 "$BUILD_DIR/deploy/systemd/hero3-maintenance-status.timer" /etc/systemd/system/hero3-maintenance-status.timer
            install -m 644 "$BUILD_DIR/deploy/systemd/hero3-daily-update-announcement.service" /etc/systemd/system/hero3-daily-update-announcement.service
            install -m 644 "$BUILD_DIR/deploy/systemd/hero3-daily-update-announcement.timer" /etc/systemd/system/hero3-daily-update-announcement.timer
            timeout --kill-after=10s 60s systemctl daemon-reload
            timeout --kill-after=10s 60s systemctl enable --now hero3-battle-report-cleanup.timer
            timeout --kill-after=10s 60s systemctl enable --now hero3-maintenance-status.timer
            timeout --kill-after=10s 60s systemctl enable --now hero3-daily-update-announcement.timer
          fi
          if ! timeout --kill-after=10s 120s systemctl restart hero3; then
            log "hero3 restart failed or timed out"
            show_hero3_logs
            exit 1
          fi
          timeout --kill-after=10s 30s nginx -t
          timeout --kill-after=10s 30s systemctl reload nginx
          if ! timeout --kill-after=10s 60s curl --fail --show-error --silent --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:8081/healthz; then
            log "hero3 local health check failed"
            show_hero3_logs
            exit 1
          fi

          rm -rf "$BUILD_DIR"
          EOF

      - name: Health check
        run: |
          curl --fail --show-error --silent --retry 10 --retry-delay 2 --retry-connrefused "$HERO3_HEALTH_URL"
