# Hero3 自动发布流程：Actions 只触发服务器拉取、构建和部署。
name: Deploy Hero3

on:
  push:
    branches:
      - main-core
  workflow_dispatch:

concurrency:
  group: hero3-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy on server
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      HERO3_HEALTH_URL: https://hero3.ccoos.cn/healthz

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build release artifacts
        run: |
          set -euo pipefail
          RELEASE_DIR="/tmp/hero3-release.${GITHUB_SHA}"
          RELEASE_ARCHIVE="/tmp/hero3-release.${GITHUB_SHA}.tar.gz"
          rm -rf "$RELEASE_DIR" "$RELEASE_ARCHIVE"
          mkdir -p "$RELEASE_DIR/go/bin" "$RELEASE_DIR/go/config" "$RELEASE_DIR/web" "$RELEASE_DIR/admin" "$RELEASE_DIR/deploy"

          cd "$GITHUB_WORKSPACE/go"
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o "$RELEASE_DIR/go/bin/hero3-server" ./cmd/server
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o "$RELEASE_DIR/go/bin/hero3-dbtool" ./cmd/dbtool
          rsync -a "$GITHUB_WORKSPACE/go/config/" "$RELEASE_DIR/go/config/"

          corepack enable
          corepack prepare pnpm@10.24.0 --activate

          cd "$GITHUB_WORKSPACE/web"
          pnpm install --frozen-lockfile
          pnpm build
          rsync -a "$GITHUB_WORKSPACE/web/dist/" "$RELEASE_DIR/web/"

          cd "$GITHUB_WORKSPACE/admin"
          pnpm install --frozen-lockfile
          pnpm build
          rsync -a "$GITHUB_WORKSPACE/admin/dist/" "$RELEASE_DIR/admin/"

          if [ -d "$GITHUB_WORKSPACE/deploy/systemd" ]; then
            mkdir -p "$RELEASE_DIR/deploy/systemd"
            rsync -a "$GITHUB_WORKSPACE/deploy/systemd/" "$RELEASE_DIR/deploy/systemd/"
          fi
          tar -czf "$RELEASE_ARCHIVE" -C "$RELEASE_DIR" .
          echo "HERO3_RELEASE_ARCHIVE=$RELEASE_ARCHIVE" >> "$GITHUB_ENV"

      - name: Configure SSH
        env:
          HERO3_SSH_HOST: ${{ secrets.HERO3_SSH_HOST }}
          HERO3_SSH_PORT: ${{ secrets.HERO3_SSH_PORT || '22' }}
          HERO3_SSH_PRIVATE_KEY: ${{ secrets.HERO3_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$HERO3_SSH_HOST"
          test -n "$HERO3_SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$HERO3_SSH_PRIVATE_KEY" > ~/.ssh/hero3_deploy_key
          chmod 600 ~/.ssh/hero3_deploy_key
          ssh-keyscan -T 10 -t ed25519 -p "$HERO3_SSH_PORT" -H "$HERO3_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          touch ~/.ssh/known_hosts

      - name: Build and deploy on server
        env:
          HERO3_REPOSITORY: ${{ github.repository }}
          HERO3_REF_NAME: ${{ github.ref_name }}
          HERO3_SHA: ${{ github.sha }}
          HERO3_SSH_HOST: ${{ secrets.HERO3_SSH_HOST }}
          HERO3_SSH_PORT: ${{ secrets.HERO3_SSH_PORT || '22' }}
          HERO3_SSH_USER: ${{ secrets.HERO3_SSH_USER }}
        run: |
          set -euo pipefail
          test -n "$HERO3_REF_NAME"
          test -n "$HERO3_SHA"
          test -n "$HERO3_SSH_USER"
          test -f "$HERO3_RELEASE_ARCHIVE"

          REMOTE_RELEASE_ARCHIVE="/tmp/hero3-release.${HERO3_SHA}.tar.gz"

          timeout --kill-after=10s 180s scp \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=6 \
            -i ~/.ssh/hero3_deploy_key \
            -P "$HERO3_SSH_PORT" \
            "$HERO3_RELEASE_ARCHIVE" \
            "$HERO3_SSH_USER@$HERO3_SSH_HOST:$REMOTE_RELEASE_ARCHIVE"

          timeout --kill-after=10s 900s ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=6 \
            -i ~/.ssh/hero3_deploy_key \
            -p "$HERO3_SSH_PORT" \
            "$HERO3_SSH_USER@$HERO3_SSH_HOST" \
            "HERO3_REF_NAME='$HERO3_REF_NAME' HERO3_SHA='$HERO3_SHA' HERO3_RELEASE_ARCHIVE='$REMOTE_RELEASE_ARCHIVE' bash -s" <<'EOF'
          set -euo pipefail

          RELEASE_DIR="/tmp/hero3-release.${HERO3_SHA}"
          STAMP="$(date +%Y%m%d%H%M%S)"

          log() {
            printf '\n[%s] %s\n' "$(date -Is)" "$*"
          }

          command -v rsync >/dev/null
          command -v flock >/dev/null
          command -v tar >/dev/null
          command -v timeout >/dev/null

          show_hero3_logs() {
            systemctl status hero3 --no-pager -l || true
            journalctl -u hero3 -n 120 --no-pager || true
          }

          exec 9>/tmp/hero3-deploy.lock
          if ! flock -n 9; then
            echo "Another Hero3 deployment is already running."
            exit 1
          fi

          mkdir -p /opt/hero3/backups /var/www/hero3/backups
          mkdir -p /opt/hero3/go/bin /opt/hero3/go/config /var/www/hero3/web /var/www/hero3/admin

          log "Extracting uploaded release"
          test -f "$HERO3_RELEASE_ARCHIVE"
          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR"
          tar -xzf "$HERO3_RELEASE_ARCHIVE" -C "$RELEASE_DIR"
          rm -f "$HERO3_RELEASE_ARCHIVE"

          log "Backing up current release"
          if [ -f /opt/hero3/go/bin/hero3-server ]; then
            cp -a /opt/hero3/go/bin/hero3-server "/opt/hero3/backups/hero3-server.$STAMP"
          fi
          if [ -d /var/www/hero3/web ]; then
            tar -czf "/var/www/hero3/backups/web.$STAMP.tar.gz" -C /var/www/hero3 web
          fi
          if [ -d /var/www/hero3/admin ]; then
            tar -czf "/var/www/hero3/backups/admin.$STAMP.tar.gz" -C /var/www/hero3 admin
          fi

          log "Installing release"
          install -m 755 "$RELEASE_DIR/go/bin/hero3-server" /opt/hero3/go/bin/hero3-server
          install -m 755 "$RELEASE_DIR/go/bin/hero3-dbtool" /opt/hero3/go/bin/hero3-dbtool
          rsync -a --delete "$RELEASE_DIR/go/config/" /opt/hero3/go/config/
          rsync -a --delete "$RELEASE_DIR/web/" /var/www/hero3/web/
          rsync -a --delete "$RELEASE_DIR/admin/" /var/www/hero3/admin/
          printf '%s %s\n' "${HERO3_SHA:0:7}" "deployed from ${HERO3_REF_NAME}" > /opt/hero3/RELEASE

          log "Restarting services"
          if [ -d "$RELEASE_DIR/deploy/systemd" ]; then
            install -m 644 "$RELEASE_DIR/deploy/systemd/hero3-battle-report-cleanup.service" /etc/systemd/system/hero3-battle-report-cleanup.service
            install -m 644 "$RELEASE_DIR/deploy/systemd/hero3-battle-report-cleanup.timer" /etc/systemd/system/hero3-battle-report-cleanup.timer
            install -m 644 "$RELEASE_DIR/deploy/systemd/hero3-maintenance-status.service" /etc/systemd/system/hero3-maintenance-status.service
            install -m 644 "$RELEASE_DIR/deploy/systemd/hero3-maintenance-status.timer" /etc/systemd/system/hero3-maintenance-status.timer
            timeout --kill-after=10s 60s systemctl daemon-reload
            timeout --kill-after=10s 60s systemctl enable --now hero3-battle-report-cleanup.timer
            timeout --kill-after=10s 60s systemctl enable --now hero3-maintenance-status.timer
          fi
          if ! timeout --kill-after=10s 120s systemctl restart hero3; then
            log "hero3 restart failed or timed out"
            show_hero3_logs
            exit 1
          fi
          timeout --kill-after=10s 30s nginx -t
          timeout --kill-after=10s 30s systemctl reload nginx
          if ! timeout --kill-after=10s 60s curl --fail --show-error --silent --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:8081/healthz; then
            log "hero3 local health check failed"
            show_hero3_logs
            exit 1
          fi

          rm -rf "$RELEASE_DIR"
          EOF

      - name: Health check
        run: |
          curl --fail --show-error --silent --retry 10 --retry-delay 2 --retry-connrefused "$HERO3_HEALTH_URL"
