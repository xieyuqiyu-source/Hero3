# Hero3 自动发布流程：Actions 只触发服务器拉取、构建和部署。
name: Deploy Hero3

on:
  push:
    branches:
      - main-core
  workflow_dispatch:

concurrency:
  group: hero3-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy on server
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      HERO3_HEALTH_URL: https://hero3.ccoos.cn/healthz

    steps:
      - name: Configure SSH
        env:
          HERO3_SSH_HOST: ${{ secrets.HERO3_SSH_HOST }}
          HERO3_SSH_PORT: ${{ secrets.HERO3_SSH_PORT || '22' }}
          HERO3_SSH_PRIVATE_KEY: ${{ secrets.HERO3_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$HERO3_SSH_HOST"
          test -n "$HERO3_SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$HERO3_SSH_PRIVATE_KEY" > ~/.ssh/hero3_deploy_key
          chmod 600 ~/.ssh/hero3_deploy_key
          ssh-keyscan -T 10 -t ed25519 -p "$HERO3_SSH_PORT" -H "$HERO3_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          touch ~/.ssh/known_hosts

      - name: Build and deploy on server
        env:
          HERO3_REPOSITORY: ${{ github.repository }}
          HERO3_REF_NAME: ${{ github.ref_name }}
          HERO3_SHA: ${{ github.sha }}
          HERO3_SSH_HOST: ${{ secrets.HERO3_SSH_HOST }}
          HERO3_SSH_PORT: ${{ secrets.HERO3_SSH_PORT || '22' }}
          HERO3_SSH_USER: ${{ secrets.HERO3_SSH_USER }}
        run: |
          set -euo pipefail
          test -n "$HERO3_REPOSITORY"
          test -n "$HERO3_REF_NAME"
          test -n "$HERO3_SHA"
          test -n "$HERO3_SSH_USER"

          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=6 \
            -i ~/.ssh/hero3_deploy_key \
            -p "$HERO3_SSH_PORT" \
            "$HERO3_SSH_USER@$HERO3_SSH_HOST" \
            "HERO3_REPOSITORY='$HERO3_REPOSITORY' HERO3_REF_NAME='$HERO3_REF_NAME' HERO3_SHA='$HERO3_SHA' bash -s" <<'EOF'
          set -euo pipefail

          SOURCE_DIR="/opt/hero3/source"
          REPO_URL="https://github.com/${HERO3_REPOSITORY}.git"
          STAMP="$(date +%Y%m%d%H%M%S)"
          SERVER_BIN="/tmp/hero3-server.${HERO3_SHA}"
          DBTOOL_BIN="/tmp/hero3-dbtool.${HERO3_SHA}"

          log() {
            printf '\n[%s] %s\n' "$(date -Is)" "$*"
          }

          git_network() {
            attempt=1
            until timeout --kill-after=10s 300s git -c http.version=HTTP/1.1 "$@"; do
              if [ "$attempt" -ge 3 ]; then
                return 1
              fi
              sleep "$((attempt * 10))"
              attempt="$((attempt + 1))"
              log "Retrying git network operation, attempt ${attempt}/3"
            done
          }

          command -v git >/dev/null
          command -v go >/dev/null
          command -v pnpm >/dev/null
          command -v rsync >/dev/null
          command -v flock >/dev/null
          command -v timeout >/dev/null

          exec 9>/tmp/hero3-deploy.lock
          if ! flock -n 9; then
            echo "Another Hero3 deployment is already running."
            exit 1
          fi

          mkdir -p /opt/hero3/backups /var/www/hero3/backups
          mkdir -p /opt/hero3/go/bin /opt/hero3/go/config /var/www/hero3/web /var/www/hero3/admin

          log "Updating source"
          if [ -d "$SOURCE_DIR/.git" ]; then
            git -C "$SOURCE_DIR" remote set-url origin "$REPO_URL"
            if git -C "$SOURCE_DIR" cat-file -e "$HERO3_SHA^{commit}" 2>/dev/null; then
              log "Source already has target commit"
            else
              git_network -C "$SOURCE_DIR" fetch --depth 1 --prune origin "$HERO3_REF_NAME"
            fi
          else
            rm -rf "$SOURCE_DIR"
            git_network clone --depth 1 --single-branch --branch "$HERO3_REF_NAME" "$REPO_URL" "$SOURCE_DIR"
          fi

          git -C "$SOURCE_DIR" checkout -f "$HERO3_SHA"
          git -C "$SOURCE_DIR" reset --hard "$HERO3_SHA"
          git -C "$SOURCE_DIR" clean -fd

          log "Building backend"
          cd "$SOURCE_DIR/go"
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o "$SERVER_BIN" ./cmd/server
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o "$DBTOOL_BIN" ./cmd/dbtool

          log "Building web"
          cd "$SOURCE_DIR/web"
          pnpm install --frozen-lockfile
          pnpm build

          log "Building admin"
          cd "$SOURCE_DIR/admin"
          pnpm install --frozen-lockfile
          pnpm build

          log "Backing up current release"
          if [ -f /opt/hero3/go/bin/hero3-server ]; then
            cp -a /opt/hero3/go/bin/hero3-server "/opt/hero3/backups/hero3-server.$STAMP"
          fi
          if [ -d /var/www/hero3/web ]; then
            tar -czf "/var/www/hero3/backups/web.$STAMP.tar.gz" -C /var/www/hero3 web
          fi
          if [ -d /var/www/hero3/admin ]; then
            tar -czf "/var/www/hero3/backups/admin.$STAMP.tar.gz" -C /var/www/hero3 admin
          fi

          log "Installing release"
          install -m 755 "$SERVER_BIN" /opt/hero3/go/bin/hero3-server
          install -m 755 "$DBTOOL_BIN" /opt/hero3/go/bin/hero3-dbtool
          rsync -a --delete "$SOURCE_DIR/go/config/" /opt/hero3/go/config/
          rsync -a --delete "$SOURCE_DIR/web/dist/" /var/www/hero3/web/
          rsync -a --delete "$SOURCE_DIR/admin/dist/" /var/www/hero3/admin/
          git -C "$SOURCE_DIR" log -1 --pretty='%h %s' > /opt/hero3/RELEASE

          log "Restarting services"
          if [ -d "$SOURCE_DIR/deploy/systemd" ]; then
            install -m 644 "$SOURCE_DIR/deploy/systemd/hero3-battle-report-cleanup.service" /etc/systemd/system/hero3-battle-report-cleanup.service
            install -m 644 "$SOURCE_DIR/deploy/systemd/hero3-battle-report-cleanup.timer" /etc/systemd/system/hero3-battle-report-cleanup.timer
            install -m 644 "$SOURCE_DIR/deploy/systemd/hero3-maintenance-status.service" /etc/systemd/system/hero3-maintenance-status.service
            install -m 644 "$SOURCE_DIR/deploy/systemd/hero3-maintenance-status.timer" /etc/systemd/system/hero3-maintenance-status.timer
            systemctl daemon-reload
            systemctl enable --now hero3-battle-report-cleanup.timer
            systemctl enable --now hero3-maintenance-status.timer
          fi
          systemctl restart hero3
          nginx -t
          systemctl reload nginx
          curl --fail --show-error --silent --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:8081/healthz

          rm -f "$SERVER_BIN" "$DBTOOL_BIN"
          EOF

      - name: Health check
        run: |
          curl --fail --show-error --silent --retry 10 --retry-delay 2 --retry-connrefused "$HERO3_HEALTH_URL"
