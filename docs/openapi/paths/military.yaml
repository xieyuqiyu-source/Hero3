/api/v1/military/recruit:
  post:
    tags:
    - Military
    summary: 发起征兵
    description: 消耗资源创建征兵队列。队列到期后，后端在游戏状态结算时自动将兵力加入军队并移除该队列。
    operationId: recruitUnits
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RecruitRequest'
    responses:
      '200':
        description: 征兵已进入队列，返回更新后的游戏状态
        content:
          application/json:
            schema:
              type: object
              required:
              - state
              properties:
                state:
                  $ref: '#/components/schemas/GameState'
      '400':
        description: 征兵数量无效
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '404':
        description: 玩家或兵种不存在
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '409':
        description: 征兵队列已满
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '422':
        description: 资源不足
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
/api/v1/military/recruit/instant:
  post:
    tags:
    - Military
    summary: 极速完成征兵队列
    description: 立即完成指定征兵队列并重新计算后续队列结束时间。金币消耗暂未接入，当前用于开发和 GM 验证。
    operationId: instantCompleteRecruit
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InstantCompleteRecruitRequest'
    responses:
      '200':
        description: 征兵队列已完成，返回更新后的游戏状态
        content:
          application/json:
            schema:
              type: object
              required:
              - state
              properties:
                state:
                  $ref: '#/components/schemas/GameState'
      '400':
        description: 参数错误或队列不存在
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '404':
        description: 玩家不存在
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
/api/v1/military/general/stat:
  post:
    tags:
    - Military
    summary: 将领四维加点
    operationId: allocateGeneralStat
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AllocateGeneralStatRequest'
    responses:
      '200':
        description: 加点成功，返回更新后的游戏状态
        content:
          application/json:
            schema:
              type: object
              required:
              - state
              properties:
                state:
                  $ref: '#/components/schemas/GameState'
      '400':
        description: 参数错误
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '404':
        description: 玩家或将领不存在
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '409':
        description: 没有可用点数或属性已满
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
/api/v1/military/general/reset-stats:
  post:
    tags:
    - Military
    summary: 将领洗点
    description: 消耗账户金币 10 个，清空当前将领四维加点，保留将领、等级和经验，无冷却。
    operationId: resetGeneralStats
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResetGeneralStatsRequest'
    responses:
      '200':
        description: 洗点成功，返回更新后的状态和账户金币余额
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeneralActionResult'
      '404':
        description: 玩家、账号或将领不存在
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '422':
        description: 金币不足
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
/api/v1/military/general/change:
  post:
    tags:
    - Military
    summary: 更换将领
    description: 仅允许更换当前存档阵营内的其它将领。保留等级和经验，重置四维加点。itemId 为预留换将卡消耗字段，传入时会消耗背包中 1 个对应物品。
    operationId: changeGeneral
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ChangeGeneralRequest'
    responses:
      '200':
        description: 换将成功，返回更新后的状态和账户金币余额
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeneralActionResult'
      '404':
        description: 玩家、将领或换将卡物品配置不存在
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '422':
        description: 将领不属于当前阵营、不能更换为当前将领，或换将卡库存不足
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
