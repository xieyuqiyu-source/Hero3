/api/v1/announcements:
  get:
    tags:
    - Announcement
    summary: 获取当前玩家可见公告列表
    parameters:
    - name: playerId
      in: query
      required: true
      schema:
        type: string
    responses:
      '200':
        description: 公告列表和未读数量
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnouncementPage'
      '404':
        description: 玩家不存在
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
/api/v1/announcements/{announcementId}:
  get:
    tags:
    - Announcement
    summary: 获取当前玩家可见公告详情
    parameters:
    - name: announcementId
      in: path
      required: true
      schema:
        type: string
    - name: playerId
      in: query
      required: true
      schema:
        type: string
    responses:
      '200':
        description: 公告详情
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Announcement'
      '404':
        description: 公告不存在、未发布、未到展示时间或已过期
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
/api/v1/announcements/{announcementId}/read:
  post:
    tags:
    - Announcement
    summary: 标记当前玩家公告已读
    parameters:
    - name: announcementId
      in: path
      required: true
      schema:
        type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MarkAnnouncementReadRequest'
    responses:
      '200':
        description: 已读后的公告详情
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Announcement'
      '404':
        description: 公告不存在或当前不可见
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
/api/v1/admin/announcements:
  get:
    tags:
    - Admin
    summary: GM 获取公告列表
    responses:
      '200':
        description: GM 公告列表
        content:
          application/json:
            schema:
              type: object
              required: [announcements]
              properties:
                announcements:
                  type: array
                  items:
                    $ref: '#/components/schemas/Announcement'
  post:
    tags:
    - Admin
    summary: GM 创建公告草稿
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AnnouncementInput'
    responses:
      '201':
        description: 已创建的公告草稿
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Announcement'
      '400':
        description: 标题、正文或时间配置不合法
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
/api/v1/admin/announcements/{announcementId}:
  put:
    tags:
    - Admin
    summary: GM 编辑公告
    parameters:
    - name: announcementId
      in: path
      required: true
      schema:
        type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AnnouncementInput'
    responses:
      '200':
        description: 更新后的公告
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Announcement'
      '404':
        description: 公告不存在
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
  delete:
    tags:
    - Admin
    summary: GM 删除公告（软删除为 archived）
    parameters:
    - name: announcementId
      in: path
      required: true
      schema:
        type: string
    responses:
      '200':
        description: 已归档的公告
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Announcement'
      '404':
        description: 公告不存在
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
/api/v1/admin/announcements/{announcementId}/publish:
  post:
    tags:
    - Admin
    summary: GM 发布公告
    parameters:
    - name: announcementId
      in: path
      required: true
      schema:
        type: string
    responses:
      '200':
        description: 已发布公告
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Announcement'
      '404':
        description: 公告不存在
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
/api/v1/admin/announcements/{announcementId}/archive:
  post:
    tags:
    - Admin
    summary: GM 下架公告
    parameters:
    - name: announcementId
      in: path
      required: true
      schema:
        type: string
    responses:
      '200':
        description: 已下架公告
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Announcement'
      '404':
        description: 公告不存在
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
