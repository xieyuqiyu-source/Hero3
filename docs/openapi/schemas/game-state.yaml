GameState:
  type: object
  required:
  - player
  - resources
  - resourceProduction
  - resourceSettledAt
  - buildings
  - army
  - garrisonArmy
  - recruitQueues
  - mapTargets
  - recentBattleReports
  - unreadMessageCount
  - unreadMailCount
  - serverTime
  properties:
    player:
      $ref: '#/components/schemas/Player'
    resources:
      $ref: '#/components/schemas/ResourceState'
    resourceProduction:
      $ref: '#/components/schemas/ResourceProduction'
    resourceSettledAt:
      type: string
      format: date-time
      description: 资源上次由后端权威结算的时间。
    buildings:
      type: array
      items:
        $ref: '#/components/schemas/Building'
    army:
      type: array
      description: 玩家自己的主军队。本阶段增援兵不会并入这里。
      items:
        $ref: '#/components/schemas/ArmyUnit'
    garrisonArmy:
      type: array
      description: 驻防军队。来自其他玩家增援，或玩家通过奖励等非增援渠道获得的非本阵营兵种。
      items:
        $ref: '#/components/schemas/ArmyUnit'
    recruitQueues:
      type: array
      items:
        $ref: '#/components/schemas/RecruitQueue'
    npcState:
      nullable: true
      allOf:
      - $ref: '#/components/schemas/NpcState'
    mapTargets:
      type: array
      items:
        $ref: '#/components/schemas/MapTarget'
    recentBattleReports:
      type: array
      description: 兼容字段。军情列表已拆到 /api/v1/news/reports 分页接口，game/state 默认返回空数组。
      items:
        $ref: '#/components/schemas/BattleReport'
    unreadMessageCount:
      type: integer
      example: 0
    unreadMailCount:
      type: integer
      example: 0
    serverTime:
      type: string
      format: date-time
Player:
  type: object
  required:
  - id
  - nickname
  - faction
  properties:
    id:
      type: string
      example: player_47f23e0eeb08ab50402fedfc
    nickname:
      type: string
      example: 主公
    mailCode:
      type: string
      description: 玩家信函短编号，与昵称组合成 玩家昵称#编号。
      example: '482193'
    faction:
      type: string
      example: wei
ResourceState:
  type: object
  required:
  - items
  - capacity
  properties:
    items:
      type: object
      description: 资源当前数量，key 为资源类型，可扩展。
      additionalProperties:
        type: integer
      example:
        wood: 1200
        stone: 900
        iron: 600
        food: 1500
    capacity:
      type: object
      description: 各资源容量上限，key 与资源类型一致。
      additionalProperties:
        type: integer
      example:
        wood: 7500
        stone: 7500
        iron: 7500
        food: 7500
ResourceProduction:
  type: object
  description: 每小时资源产量，key 为资源类型，可扩展。
  additionalProperties:
    type: integer
  example:
    wood: 84
    stone: 62
    iron: 48
    food: 100
Building:
  type: object
  required:
  - id
  - type
  - level
  - upgradeEndsAt
  properties:
    id:
      type: string
      example: wood-camp
    type:
      type: string
      example: wood_camp
    level:
      type: integer
      example: 3
    upgradeEndsAt:
      type: string
      nullable: true
      example: null
ArmyUnit:
  type: object
  required:
  - unitType
  - amount
  properties:
    unitType:
      type: string
      example: infantry
    amount:
      type: integer
      example: 80
RecruitQueue:
  type: object
  required:
  - id
  - unitType
  - amount
  - endsAt
  properties:
    id:
      type: string
    unitType:
      type: string
    amount:
      type: integer
    endsAt:
      type: string
      format: date-time
MapTarget:
  type: object
  required:
  - id
  - type
  - level
  - power
  - rewards
  properties:
    id:
      type: string
      example: target-001
    type:
      type: string
      example: bandit_camp
    level:
      type: integer
      example: 1
    power:
      type: integer
      example: 100
    rewards:
      type: object
      additionalProperties:
        type: integer
BattleReport:
  type: object
  properties:
    id:
      type: string
    playerId:
      type: string
    playerName:
      type: string
    targetId:
      type: string
    targetName:
      type: string
    type:
      type: string
      enum:
      - attack
      - plunder
      - scout
      - reinforce
      - pvp_attack
    result:
      type: string
    playerPower:
      type: integer
    enemyPower:
      type: integer
    dispatchedUnits:
      type: object
      description: 攻击方出征兵力。
      additionalProperties:
        type: integer
    lostUnits:
      type: object
      description: 攻击方战损。
      additionalProperties:
        type: integer
    defenderFaction:
      type: string
    defenderUnits:
      type: object
      description: 防守方主军队与驻防军队聚合后的展示数量。
      additionalProperties:
        type: integer
    defenderArmyUnits:
      type: object
      description: PVP 防守方主军队参战数量。
      additionalProperties:
        type: integer
    defenderGarrisonUnits:
      type: object
      description: PVP 防守方驻防军队参战数量。
      additionalProperties:
        type: integer
    defenderLostUnits:
      type: object
      description: 防守方总战损，含主军队与驻防军队。
      additionalProperties:
        type: integer
    defenderArmyLostUnits:
      type: object
      description: PVP 防守方主军队战损，后端会从 army 扣除。
      additionalProperties:
        type: integer
    defenderGarrisonLostUnits:
      type: object
      description: 防守方驻防军队战损，后端会从 garrisonArmy 扣除。
      additionalProperties:
        type: integer
    defenderNoGuard:
      type: boolean
      description: PVP 防守方无可战斗守军时为 true。
    defenderRevealed:
      type: boolean
    defenderResources:
      type: object
      additionalProperties:
        type: integer
    rewards:
      type: object
      description: 攻击方掠夺或获得的资源。
      additionalProperties:
        type: integer
    generalExpGained:
      type: integer
    generalLevelBefore:
      type: integer
    generalLevelAfter:
      type: integer
    capturedUnits:
      type: object
      additionalProperties:
        type: integer
    capturedToGarrison:
      type: object
      additionalProperties:
        type: integer
    revivedUnits:
      type: object
      additionalProperties:
        type: integer
    traitTriggered:
      type: array
      items:
        type: string
    traitOutcomes:
      type: object
      additionalProperties:
        type: object
    createdAt:
      type: string
      format: date-time
BattleReportPage:
  type: object
  required:
  - reports
  - page
  - pageSize
  - total
  properties:
    reports:
      type: array
      items:
        $ref: '#/components/schemas/BattleReport'
    page:
      type: integer
      example: 1
    pageSize:
      type: integer
      example: 10
    total:
      type: integer
      description: 符合条件的战报总数。
      example: 23
BalanceConfig:
  type: object
  required:
  - baseProduction
  - buildings
  properties:
    baseProduction:
      type: object
      additionalProperties:
        type: integer
      example:
        wood: 30
        stone: 30
        iron: 20
        food: 40
    buildings:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/BuildingConfig'
    march:
      $ref: '#/components/schemas/MarchConfig'
BuildingConfig:
  type: object
  required:
  - type
  - name
  properties:
    type:
      type: string
      example: wood_camp
    name:
      type: string
      example: 伐木场
    resourceType:
      type: string
      example: wood
    productionByLevel:
      type: array
      items:
        type: integer
      example:
      - 0
      - 18
      - 36
      - 54
    capacityByLevel:
      type: array
      items:
        type: integer
      example:
      - 5000
      - 7500
      - 10000
    upgradeCostByLevel:
      type: object
      additionalProperties:
        type: object
        additionalProperties:
          type: integer
      example:
        '1':
          wood: 50
          stone: 80
          iron: 30
          food: 20
    upgradeSecondsByLevel:
      type: object
      additionalProperties:
        type: integer
      example:
        '1': 30
        '2': 45
