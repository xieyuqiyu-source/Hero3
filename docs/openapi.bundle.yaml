openapi: 3.0.3
info:
  title: Hero3 API
  version: 0.1.0
  description: Hero3 当前 MVP 阶段的后端接口文档，可导入 Apifox。
servers:
- url: http://localhost:8080
  description: 本地 Go 后端
- url: http://124.223.111.163:8080
  description: 服务器后端占位，部署后按实际端口调整
tags:
- name: System
  description: 服务状态
- name: Game
  description: 游戏状态
- name: Account
  description: 轻账号与存档
- name: City
  description: 城池建设
- name: Military
  description: 军事与征兵
- name: Map
  description: 地图、NPC 城池与战斗
- name: PVP
  description: 玩家互攻、行军队列和行军加速
- name: News
  description: 军情与战报
- name: Mail
  description: 信函系统
- name: Announcement
  description: 公告系统
- name: MiniGame
  description: 万象幻境小游戏
- name: Admin
  description: GM 后台接口
paths:
  /healthz:
    get:
      tags:
      - System
      summary: 健康检查
      operationId: getHealth
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthState'
  /api/v1/meta:
    get:
      tags:
      - System
      summary: 服务元信息
      operationId: getMeta
      responses:
        '200':
          description: 服务信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaState'
  /api/v1/game/bootstrap:
    get:
      tags:
      - Game
      summary: 游戏模块启动信息
      operationId: getGameBootstrap
      responses:
        '200':
          description: 游戏模块信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapResponse'
  /api/v1/game/state:
    get:
      tags:
      - Game
      summary: 获取游戏状态
      operationId: getGameState
      parameters:
      - name: playerId
        in: query
        required: true
        description: 玩家存档 ID。
        schema:
          type: string
          example: player_47f23e0eeb08ab50402fedfc
      responses:
        '200':
          description: 游戏状态快照
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameState'
        '404':
          description: 玩家存档不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: 缺少玩家存档 ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/accounts/register:
    post:
      tags:
      - Account
      summary: 注册轻账号
      operationId: registerAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountRequest'
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSession'
        '400':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 账号已存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/accounts/login:
    post:
      tags:
      - Account
      summary: 登录轻账号
      operationId: loginAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSession'
        '401':
          description: 账号或密码错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/accounts/{accountId}/players:
    get:
      tags:
      - Account
      summary: 查看账号绑定的存档
      operationId: listAccountPlayers
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          example: acc_958538e3bc17faf00407ddcc
      responses:
        '200':
          description: 存档列表
          content:
            application/json:
              schema:
                type: object
                required:
                - players
                properties:
                  players:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlayerSummary'
        '404':
          description: 账号不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/accounts/{accountId}:
    delete:
      tags:
      - Account
      summary: 删除账号
      description: 删除账号，同时删除该账号关联的全部云存档。
      operationId: deleteAccount
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          example: acc_958538e3bc17faf00407ddcc
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '404':
          description: 账号不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/players/create:
    post:
      tags:
      - Account
      summary: 创建账号绑定的游戏存档
      operationId: createPlayer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlayerRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                type: object
                required:
                - playerId
                - state
                properties:
                  playerId:
                    type: string
                    example: player_47f23e0eeb08ab50402fedfc
                  state:
                    $ref: '#/components/schemas/GameState'
        '400':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 账号不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/players/{playerId}:
    delete:
      tags:
      - Account
      summary: 删除云存档
      description: 删除指定 playerId 对应的云存档，不删除账号。
      operationId: deletePlayer
      parameters:
      - name: playerId
        in: path
        required: true
        schema:
          type: string
          example: player_47f23e0eeb08ab50402fedfc
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '404':
          description: 存档不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/city/buildings/upgrade:
    post:
      tags:
      - City
      summary: 升级建筑
      description: 消耗资源发起建筑升级，升级完成前该建筑不可再次升级。
      operationId: upgradeBuilding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpgradeBuildingRequest'
      responses:
        '200':
          description: 升级已开始，返回更新后的游戏状态
          content:
            application/json:
              schema:
                type: object
                required:
                - state
                properties:
                  state:
                    $ref: '#/components/schemas/GameState'
        '404':
          description: 玩家或建筑不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 建筑正在升级中
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 资源不足或已满级
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/city/buildings/upgrade-batch:
    post:
      tags:
      - City
      summary: 批量升级资源建筑
      description: 按等级从低到高依次尝试升级所有空闲资源建筑，直到资源耗尽。
      operationId: upgradeBuildingBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - playerId
              properties:
                playerId:
                  type: string
                  example: player_47f23e0eeb08ab50402fedfc
      responses:
        '200':
          description: 批量升级完成
          content:
            application/json:
              schema:
                type: object
                required:
                - state
                - upgraded
                properties:
                  state:
                    $ref: '#/components/schemas/GameState'
                  upgraded:
                    type: integer
                    description: 本次成功升级的建筑数量
                    example: 3
        '404':
          description: 玩家不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 资源不足，无法升级任何建筑
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/city/resources/fill:
    post:
      tags:
      - City
      summary: GM 填满资源
      description: 将指定玩家的所有资源填满到仓库容量上限。
      operationId: fillResources
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - playerId
              properties:
                playerId:
                  type: string
                  example: player_47f23e0eeb08ab50402fedfc
      responses:
        '200':
          description: 资源已填满
          content:
            application/json:
              schema:
                type: object
                required:
                - state
                properties:
                  state:
                    $ref: '#/components/schemas/GameState'
        '404':
          description: 玩家不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/military/recruit:
    post:
      tags:
      - Military
      summary: 发起征兵
      description: 消耗资源创建征兵队列。队列到期后，后端在游戏状态结算时自动将兵力加入军队并移除该队列。
      operationId: recruitUnits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecruitRequest'
      responses:
        '200':
          description: 征兵已进入队列，返回更新后的游戏状态
          content:
            application/json:
              schema:
                type: object
                required:
                - state
                properties:
                  state:
                    $ref: '#/components/schemas/GameState'
        '400':
          description: 征兵数量无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 玩家或兵种不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 征兵队列已满
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 资源不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/military/recruit/instant:
    post:
      tags:
      - Military
      summary: 极速完成征兵队列
      description: 立即完成指定征兵队列并重新计算后续队列结束时间。金币消耗暂未接入，当前用于开发和 GM 验证。
      operationId: instantCompleteRecruit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstantCompleteRecruitRequest'
      responses:
        '200':
          description: 征兵队列已完成，返回更新后的游戏状态
          content:
            application/json:
              schema:
                type: object
                required:
                - state
                properties:
                  state:
                    $ref: '#/components/schemas/GameState'
        '400':
          description: 参数错误或队列不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 玩家不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/military/general/stat:
    post:
      tags:
      - Military
      summary: 将领四维加点
      operationId: allocateGeneralStat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllocateGeneralStatRequest'
      responses:
        '200':
          description: 加点成功，返回更新后的游戏状态
          content:
            application/json:
              schema:
                type: object
                required:
                - state
                properties:
                  state:
                    $ref: '#/components/schemas/GameState'
        '400':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 玩家或将领不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 没有可用点数或属性已满
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/military/general/reset-stats:
    post:
      tags:
      - Military
      summary: 将领洗点
      description: 消耗账户金币 10 个，清空当前将领四维加点，保留将领、等级和经验，无冷却。
      operationId: resetGeneralStats
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetGeneralStatsRequest'
      responses:
        '200':
          description: 洗点成功，返回更新后的状态和账户金币余额
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralActionResult'
        '404':
          description: 玩家、账号或将领不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 金币不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/military/general/change:
    post:
      tags:
      - Military
      summary: 更换将领
      description: 仅允许更换当前存档阵营内的其它将领。保留等级和经验，重置四维加点。itemId 为预留换将卡消耗字段，传入时会消耗背包中 1
        个对应物品。
      operationId: changeGeneral
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeGeneralRequest'
      responses:
        '200':
          description: 换将成功，返回更新后的状态和账户金币余额
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralActionResult'
        '404':
          description: 玩家、将领或换将卡物品配置不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 将领不属于当前阵营、不能更换为当前将领，或换将卡库存不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/map/npc-cities:
    get:
      tags:
      - Map
      summary: 获取 NPC 城池列表
      description: 按玩家存档读取 NPC 城池状态。若该玩家尚未生成 NPC 城池，或已超过刷新周期，后端会生成并保存新的 NPC 状态。
      operationId: getNpcCities
      parameters:
      - name: playerId
        in: query
        required: true
        description: 玩家存档 ID。
        schema:
          type: string
          example: player_47f23e0eeb08ab50402fedfc
      responses:
        '200':
          description: NPC 城池状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NpcState'
        '404':
          description: 玩家不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/map/npc-cities/refresh:
    post:
      tags:
      - Map
      summary: 手动刷新 NPC 城池
      description: 重新生成该玩家的 NPC 城池列表。金币消耗暂未接入，当前用于开发和 GM 验证。
      operationId: refreshNpcCities
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NpcCitiesRefreshRequest'
      responses:
        '200':
          description: 刷新后的 NPC 城池状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NpcState'
        '404':
          description: 玩家不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/map/npc-cities/attack:
    post:
      tags:
      - Map
      summary: 攻击或掠夺 NPC 城池
      description: 扣除出征兵力，执行战斗结算，归还存活兵力，更新 NPC 守军、NPC 资源、玩家资源和最近战报。
      operationId: attackNpcCity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttackNpcRequest'
      responses:
        '200':
          description: 战斗结算结果和更新后的游戏状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttackNpcResponse'
        '400':
          description: 参数错误或未选择出征兵力
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 玩家、NPC 城池或兵种不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 出征兵力不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/map/npc-cities/scout:
    post:
      tags:
      - Map
      summary: 侦查 NPC 城池
      description: 消耗侦察兵，返回目标 NPC 城池完整信息和更新后的游戏状态。
      operationId: scoutNpcCity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoutNpcRequest'
      responses:
        '200':
          description: 侦查结果和更新后的游戏状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoutNpcResponse'
        '400':
          description: 参数错误或没有可用侦察兵种
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 玩家或 NPC 城池不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 侦察兵数量不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/map/players/attack:
    post:
      tags:
      - Map
      summary: 兼容入口：攻击其他玩家并创建 PVP 行军
      description: 兼容旧路径。当前实现与 /api/v1/pvp/attack 相同：攻击方从主军队出征并创建行军，不立即结算战斗。
      operationId: attackPlayerCity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttackPlayerRequest'
      responses:
        '201':
          description: PVP 行军已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttackPlayerResponse'
        '400':
          description: 参数错误、目标无效或未选择出征兵力
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 玩家或兵种不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 出征兵力不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/map/players/reinforce:
    post:
      tags:
      - Map
      summary: 增援其他玩家
      description: 只能增援其他玩家，不能增援 NPC 城池。发起方扣除对应兵力；抵达后无论兵种阵营，全部进入目标玩家 garrisonArmy。
      operationId: reinforcePlayer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReinforcePlayerRequest'
      responses:
        '200':
          description: 增援结果、发起方状态和目标玩家状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReinforcePlayerResponse'
        '400':
          description: 参数错误、目标无效、选择了 NPC 或未选择增援兵力
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 玩家或兵种不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 增援兵力不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/pvp/targets:
    get:
      tags:
      - PVP
      summary: 获取可攻击玩家目标列表
      description: 返回在线和离线玩家目标，排除自己和同账号其他存档，不暴露完整军队。
      operationId: listPvpTargets
      parameters:
      - name: playerId
        in: query
        required: true
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          default: 20
          maximum: 50
      responses:
