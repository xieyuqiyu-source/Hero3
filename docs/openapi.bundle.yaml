      description: 从攻击方主军队扣除出征兵力并创建 PVP 行军；不会立即结算战斗，行军到达后由统一结算入口生成双方战报。
      operationId: startPvpAttack
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PvpAttackRequest'
      responses:
        '201':
          description: 行军已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PvpAttackResponse'
        '400':
          description: 目标无效、不能攻击自己或同账号存档、包含非战斗兵种
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 玩家、目标或兵种不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 出征兵力不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
