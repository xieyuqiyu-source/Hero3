      - totalRecords
      - limit
      - offset
      - hasMore
      - records
      - rewardTotals
      properties:
        totalRecords:
          type: integer
          description: 符合筛选条件的记录总数，不是当前页条数。
        limit:
          type: integer
          description: 当前页请求条数上限。
        offset:
          type: integer
          description: 当前页偏移量。
        hasMore:
          type: boolean
          description: 是否还有下一页。
        records:
          type: array
          items:
            $ref: '#/components/schemas/MiniGameRecord'
        rewardTotals:
          type: object
          description: 按剩余可兑换数量汇总。
          additionalProperties:
            type: integer
    MiniGameRecordRequest:
      type: object
      required:
      - playerId
      - gameType
      - resultName
      properties:
        playerId:
          type: string
        gameType:
          type: string
          enum:
          - fishing
          - gambling
        resultName:
          type: string
        rarity:
          type: string
        rewardUnit:
          type: string
        rewardAmount:
          type: integer
        betUnit:
          type: string
        betAmount:
          type: integer
    MiniGameRedeemRequest:
      type: object
      required:
      - playerId
      - recordId
      - amount
      properties:
        playerId:
          type: string
        recordId:
          type: string
        amount:
