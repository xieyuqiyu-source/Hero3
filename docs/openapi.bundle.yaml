        id:
          type: string
          example: ann_47f23e0eeb08ab50402fedfc
        title:
          type: string
          maxLength: 120
          example: 系统公告
        content:
          type: string
          maxLength: 10000
          example: 这里是公告正文。
        type:
          $ref: '#/components/schemas/AnnouncementType'
        status:
          $ref: '#/components/schemas/AnnouncementStatus'
        pinned:
          type: boolean
          example: true
        priority:
          type: integer
          example: 10
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        read:
          type: boolean
          description: 玩家列表和详情中返回，表示当前玩家是否已读。
    AnnouncementRead:
      type: object
      required:
      - announcementId
      - playerId
      - readAt
      properties:
        announcementId:
          type: string
        playerId:
          type: string
        readAt:
          type: string
          format: date-time
    AnnouncementPage:
      type: object
      required:
      - announcements
      - unread
      properties:
        announcements:
          type: array
          items:
            $ref: '#/components/schemas/Announcement'
        unread:
          type: integer
          example: 3
    AnnouncementInput:
      type: object
      required:
      - title
      - content
      properties:
        title:
          type: string
          maxLength: 120
        content:
          type: string
          maxLength: 10000
        type:
          $ref: '#/components/schemas/AnnouncementType'
        pinned:
          type: boolean
          default: false
        priority:
          type: integer
          default: 0
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
    MarkAnnouncementReadRequest:
      type: object
      required:
      - playerId
      properties:
        playerId:
          type: string
    MiniGameRecord:
      type: object
      required:
      - id
      - playerId
      - gameType
      - resultName
      - rarity
      - rewardUnit
      - rewardAmount
      - remainingAmount
      - createdAt
      properties:
        id:
          type: string
          example: mg_47f23e0eeb08ab5040
        playerId:
          type: string
        gameType:
          type: string
          enum:
          - fishing
          - gambling
        resultName:
          type: string
          example: 金龙鱼
        rarity:
          type: string
          enum:
          - common
          - rare
          - epic
          - legendary
        rewardUnit:
          type: string
          example: 骁骑营
        rewardAmount:
          type: integer
          description: 原始钓获或赢得数量。
          example: 5000
        remainingAmount:
          type: integer
          description: 剩余可兑换库存；为 0 时表示已消耗完。
