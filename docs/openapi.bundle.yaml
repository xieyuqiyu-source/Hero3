        '404':
          description: 玩家或行军不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 行军不可加速
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 城金不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
