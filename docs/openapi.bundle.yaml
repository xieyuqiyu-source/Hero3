    get:
      tags:
      - PVP
      summary: 获取当前玩家相关 PVP 行军
      description: outgoing 行军显示出征兵力；incoming 行军只显示来源、阵营、预计抵达和倒计时，不暴露兵种数量。
      operationId: listPvpMarches
      parameters:
      - name: playerId
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 行军列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PvpMarchPage'
        '404':
          description: 玩家不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
