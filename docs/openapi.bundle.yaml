      description: 保存后影响后续新创建的行军；已出发行军继续使用创建时固化的配置。
      operationId: adminUpdateMarchConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarchConfig'
      responses:
        '200':
          description: 保存后的 PVP 行军配置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarchConfig'
        '400':
          description: 配置格式或内容不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/admin/npc-config:
    get:
      tags:
      - Admin
      summary: GM 读取 NPC 城池配置
      description: 读取 NPC 城池生成、刷新、守军、词条和侦查消耗配置。
      operationId: adminGetNpcConfig
      responses:
        '200':
          description: 当前 NPC 城池配置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NpcConfig'
    put:
      tags:
      - Admin
      summary: GM 保存 NPC 城池配置
      description: 保存后立即更新后端内存配置。已生成到玩家存档内的 NPC 城池不会自动重刷，需要调用 NPC 刷新接口才会按新配置重新生成。
      operationId: adminUpdateNpcConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NpcConfig'
      responses:
        '200':
          description: 保存后的 NPC 城池配置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NpcConfig'
        '400':
          description: 配置格式或内容不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/admin/fishing-config:
    get:
      tags:
      - Admin
      summary: GM 读取仙池垂钓配置
      description: 读取鱼池、鱼饵、稀有度概率权重配置。Web 端也会通过 game/bootstrap 获取同一份配置。
      operationId: adminGetFishingConfig
      responses:
        '200':
          description: 当前钓鱼配置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FishingConfig'
    put:
      tags:
      - Admin
      summary: GM 保存仙池垂钓配置
      description: 保存后立即更新后端内存配置，后续新进入钓鱼页面或刷新 bootstrap 的玩家会使用新鱼池和概率。
      operationId: adminUpdateFishingConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FishingConfig'
      responses:
        '200':
          description: 保存后的钓鱼配置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FishingConfig'
        '400':
          description: 配置格式或内容不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    HealthState:
      type: object
      required:
      - status
      - service
      - version
      - environment
      - time
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: Hero3 API
        version:
          type: string
          example: 0.1.0
        environment:
          type: string
          example: development
        time:
          type: string
          format: date-time
    MetaState:
      type: object
      additionalProperties: true
      example:
        service: Hero3 API
        version: 0.1.0
        environment: development
    BootstrapResponse:
      type: object
      required:
      - gameName
      - modules
      - message
      properties:
        gameName:
          type: string
          example: Hero3
        modules:
          type: array
          items:
            type: string
          example:
          - player
          - city
          - resource
          - military
          - map
          - combat
          - save
        balance:
          $ref: '#/components/schemas/BalanceConfig'
        factions:
          type: object
          additionalProperties: true
          description: 阵营配置。
        units:
          type: object
          additionalProperties: true
          description: 兵种配置，按阵营分组。
        items:
          type: object
          additionalProperties: true
          description: 道具配置。
        fishing:
          $ref: '#/components/schemas/FishingConfig'
        message:
          type: string
          example: Hero3 后端基础服务已就绪，具体玩法逻辑待接入。
    AccountRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
          example: xieyuqi
        password:
          type: string
          format: password
          example: '123456'
    AccountSession:
      type: object
      required:
      - accountId
      - username
      properties:
        accountId:
          type: string
          example: acc_958538e3bc17faf00407ddcc
        username:
          type: string
          example: xieyuqi
    CreatePlayerRequest:
      type: object
      required:
      - accountId
      - nickname
      - faction
      properties:
        accountId:
          type: string
          example: acc_958538e3bc17faf00407ddcc
        nickname:
          type: string
          example: 主公
        faction:
          type: string
          enum:
          - wei
          - shu
          - wu
          example: wei
        generalId:
          type: string
          example: caocao
    AccountSummary:
      type: object
      required:
      - id
      - username
      - createdAt
      - players
      properties:
        id:
          type: string
          example: acc_958538e3bc17faf00407ddcc
        username:
          type: string
          example: xieyuqi
        createdAt:
          type: string
          format: date-time
        players:
          type: array
          items:
            $ref: '#/components/schemas/PlayerSummary'
    PlayerSummary:
      type: object
      required:
      - id
      - nickname
      - faction
      - updatedAt
      properties:
        id:
          type: string
          example: player_47f23e0eeb08ab50402fedfc
        nickname:
          type: string
          example: 主公
        mailCode:
          type: string
          description: 玩家信函短编号，与昵称组合成 玩家昵称#编号。
          example: '482193'
        faction:
          type: string
          example: wei
        updatedAt:
          type: string
          format: date-time
    GameState:
      type: object
      required:
      - player
      - resources
      - resourceProduction
      - resourceSettledAt
      - buildings
      - army
      - garrisonArmy
      - recruitQueues
      - mapTargets
      - recentBattleReports
      - unreadMessageCount
      - unreadMailCount
      - serverTime
      properties:
        player:
          $ref: '#/components/schemas/Player'
        resources:
          $ref: '#/components/schemas/ResourceState'
        resourceProduction:
          $ref: '#/components/schemas/ResourceProduction'
        resourceSettledAt:
          type: string
          format: date-time
          description: 资源上次由后端权威结算的时间。
        buildings:
          type: array
          items:
            $ref: '#/components/schemas/Building'
        army:
          type: array
          description: 玩家自己的主军队。本阶段增援兵不会并入这里。
          items:
            $ref: '#/components/schemas/ArmyUnit'
        garrisonArmy:
          type: array
          description: 驻防军队。来自其他玩家增援，或玩家通过奖励等非增援渠道获得的非本阵营兵种。
          items:
            $ref: '#/components/schemas/ArmyUnit'
        recruitQueues:
          type: array
          items:
            $ref: '#/components/schemas/RecruitQueue'
        npcState:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/NpcState'
        mapTargets:
          type: array
          items:
            $ref: '#/components/schemas/MapTarget'
        recentBattleReports:
          type: array
          description: 兼容字段。军情列表已拆到 /api/v1/news/reports 分页接口，game/state 默认返回空数组。
          items:
            $ref: '#/components/schemas/BattleReport'
        unreadMessageCount:
          type: integer
          example: 0
        unreadMailCount:
          type: integer
          example: 0
        serverTime:
          type: string
          format: date-time
    Player:
      type: object
      required:
      - id
      - nickname
      - faction
      properties:
        id:
          type: string
          example: player_47f23e0eeb08ab50402fedfc
        nickname:
          type: string
          example: 主公
        mailCode:
          type: string
          description: 玩家信函短编号，与昵称组合成 玩家昵称#编号。
          example: '482193'
        faction:
          type: string
          example: wei
    ResourceState:
      type: object
      required:
      - items
      - capacity
      properties:
        items:
          type: object
          description: 资源当前数量，key 为资源类型，可扩展。
          additionalProperties:
            type: integer
          example:
            wood: 1200
            stone: 900
            iron: 600
            food: 1500
        capacity:
          type: object
          description: 各资源容量上限，key 与资源类型一致。
          additionalProperties:
            type: integer
          example:
            wood: 7500
            stone: 7500
            iron: 7500
            food: 7500
    ResourceProduction:
      type: object
      description: 每小时资源产量，key 为资源类型，可扩展。
      additionalProperties:
        type: integer
      example:
        wood: 84
        stone: 62
        iron: 48
        food: 100
    Building:
      type: object
      required:
      - id
      - type
      - level
      - upgradeEndsAt
      properties:
        id:
          type: string
          example: wood-camp
        type:
          type: string
          example: wood_camp
        level:
          type: integer
          example: 3
        upgradeEndsAt:
          type: string
          nullable: true
          example: null
    ArmyUnit:
      type: object
      required:
      - unitType
      - amount
      properties:
        unitType:
          type: string
          example: infantry
        amount:
          type: integer
          example: 80
    RecruitQueue:
      type: object
      required:
      - id
      - unitType
      - amount
      - endsAt
      properties:
        id:
          type: string
        unitType:
          type: string
        amount:
          type: integer
        endsAt:
          type: string
          format: date-time
    MapTarget:
      type: object
      required:
      - id
      - type
      - level
      - power
      - rewards
      properties:
        id:
          type: string
          example: target-001
        type:
          type: string
          example: bandit_camp
        level:
          type: integer
          example: 1
        power:
          type: integer
          example: 100
        rewards:
          type: object
          additionalProperties:
            type: integer
    BattleReport:
      type: object
      properties:
        id:
          type: string
        playerId:
          type: string
        playerName:
          type: string
        targetId:
          type: string
        targetName:
          type: string
        type:
          type: string
          enum:
          - attack
          - plunder
          - scout
          - reinforce
          - pvp_attack
        result:
          type: string
        playerPower:
          type: integer
        enemyPower:
          type: integer
        dispatchedUnits:
          type: object
          description: 攻击方出征兵力。
          additionalProperties:
            type: integer
        lostUnits:
          type: object
          description: 攻击方战损。
          additionalProperties:
            type: integer
        defenderFaction:
          type: string
        defenderUnits:
          type: object
          description: 防守方主军队与驻防军队聚合后的展示数量。
          additionalProperties:
            type: integer
        defenderArmyUnits:
          type: object
          description: PVP 防守方主军队参战数量。
          additionalProperties:
            type: integer
        defenderGarrisonUnits:
          type: object
          description: PVP 防守方驻防军队参战数量。
          additionalProperties:
            type: integer
        defenderLostUnits:
          type: object
          description: 防守方总战损，含主军队与驻防军队。
          additionalProperties:
            type: integer
        defenderArmyLostUnits:
          type: object
          description: PVP 防守方主军队战损，后端会从 army 扣除。
          additionalProperties:
            type: integer
        defenderGarrisonLostUnits:
          type: object
          description: 防守方驻防军队战损，后端会从 garrisonArmy 扣除。
          additionalProperties:
            type: integer
        defenderNoGuard:
          type: boolean
          description: PVP 防守方无可战斗守军时为 true。
        defenderRevealed:
          type: boolean
        defenderResources:
          type: object
          additionalProperties:
            type: integer
        rewards:
          type: object
          description: 攻击方掠夺或获得的资源。
          additionalProperties:
            type: integer
        generalExpGained:
          type: integer
        generalLevelBefore:
          type: integer
        generalLevelAfter:
          type: integer
        capturedUnits:
          type: object
          additionalProperties:
            type: integer
        capturedToGarrison:
          type: object
          additionalProperties:
            type: integer
        revivedUnits:
          type: object
          additionalProperties:
            type: integer
        traitTriggered:
          type: array
          items:
            type: string
        traitOutcomes:
          type: object
          additionalProperties:
            type: object
        createdAt:
          type: string
          format: date-time
    BattleReportPage:
      type: object
      required:
      - reports
      - page
      - pageSize
      - total
      properties:
        reports:
          type: array
          items:
            $ref: '#/components/schemas/BattleReport'
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 10
        total:
          type: integer
          description: 符合条件的战报总数。
          example: 23
    Mail:
      type: object
      required:
      - id
      - playerId
      - mailType
      - senderType
      - senderName
      - title
      - content
      - isRead
      - isClaimed
      - createdAt
      properties:
        id:
          type: string
          example: mail_47f23e0eeb08ab50402fedfc
        playerId:
          type: string
          example: player_47f23e0eeb08ab50402fedfc
        mailType:
          type: string
          enum:
          - gm_notice
          - compensation
          - reward
          - event_reward
          - system_notice
          - player_message
        senderType:
          type: string
          enum:
          - system
          - gm
          - player
        senderId:
          type: string
        senderName:
          type: string
          example: Hero3 GM
        title:
          type: string
          example: GM 通知
        content:
          type: string
          example: 这里是信函正文。
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/MailAttachment'
        sourceType:
          type: string
          enum:
          - manual
          - compensation
          - activity
          - system
          - player
          example: manual
        sourceId:
          type: string
        isRead:
          type: boolean
        isClaimed:
          type: boolean
        deletedByPlayer:
          type: boolean
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        readAt:
          type: string
          format: date-time
        claimedAt:
          type: string
          format: date-time
    MailAttachment:
      type: object
      required:
      - type
      - itemId
      - amount
      properties:
        type:
          type: string
          enum:
          - resource
          - city_gold
          - gold
          example: resource
        itemId:
          type: string
          enum:
          - wood
          - stone
          - iron
          - food
          - city_gold
          - gold
          example: wood
        amount:
          type: integer
          minimum: 1
          example: 1000
        metadata:
          type: object
          additionalProperties: true
    MailPage:
      type: object
      required:
      - mails
      - page
      - pageSize
      - total
      - unread
      properties:
        mails:
          type: array
          items:
            $ref: '#/components/schemas/Mail'
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 10
        total:
          type: integer
          example: 12
        unread:
          type: integer
          example: 2
    SendMailRequest:
      type: object
      required:
      - playerId
      - title
      - content
      properties:
        playerId:
          type: string
        mailType:
          type: string
          enum:
          - gm_notice
          - compensation
          - reward
          - event_reward
          - system_notice
          default: gm_notice
        title:
          type: string
          maxLength: 60
        content:
          type: string
          maxLength: 5000
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/MailAttachment'
        sourceType:
          type: string
          enum:
          - manual
          - compensation
          - activity
          - system
          - player
          default: manual
        sourceId:
          type: string
        expiresAt:
          type: string
          format: date-time
    SendPlayerMailRequest:
      type: object
      required:
      - senderPlayerId
      - recipient
      - title
      - content
      properties:
        senderPlayerId:
          type: string
          example: player_47f23e0eeb08ab50402fedfc
        recipient:
          type: string
          description: 收件人地址，格式为 玩家昵称#六位编号。
          example: 主公#482193
        title:
          type: string
          maxLength: 60
          example: 你好
        content:
          type: string
          maxLength: 5000
          example: 这里是玩家信函正文。
    MailClaimResult:
      type: object
      required:
      - mail
      - resources
      - cityGold
      - grantedItems
      properties:
        mail:
          $ref: '#/components/schemas/Mail'
        resources:
          $ref: '#/components/schemas/ResourceState'
        cityGold:
          type: integer
          example: 1200
        accountGold:
          type: integer
          description: 如果附件包含账号金币，则返回账号金币最新余额。
          example: 100
        grantedItems:
          type: object
          description: 本次实际发放的奖励汇总，key 为附件类型或资源类型。
          additionalProperties:
            type: integer
          example:
            wood: 1000
            city_gold: 50
    AnnouncementType:
      type: string
      enum:
      - system
      - maintenance
      - event
      - update
    AnnouncementStatus:
      type: string
      enum:
      - draft
      - published
      - archived
    Announcement:
      type: object
      required:
