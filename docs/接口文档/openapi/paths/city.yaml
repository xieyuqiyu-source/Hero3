/api/v1/city/buildings/upgrade:
  post:
    tags:
    - City
    summary: 升级建筑
    description: 消耗资源发起建筑升级，升级完成前该建筑不可再次升级。
    operationId: upgradeBuilding
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpgradeBuildingRequest'
    responses:
      '200':
        description: 升级已开始，返回城池相关局部状态
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CityActionResult'
      '404':
        description: 玩家或建筑不存在
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '409':
        description: 建筑正在升级中
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '422':
        description: 资源不足或已满级
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
/api/v1/city/buildings/upgrade-batch:
  post:
    tags:
    - City
    summary: 批量升级资源建筑
    description: 按等级从低到高依次尝试升级所有空闲资源建筑，直到资源耗尽。
    operationId: upgradeBuildingBatch
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - playerId
            properties:
              playerId:
                type: string
                example: player_47f23e0eeb08ab50402fedfc
    responses:
      '200':
        description: 批量升级完成
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CityActionResult'
      '404':
        description: 玩家不存在
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '422':
        description: 资源不足，无法升级任何建筑
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
/api/v1/city/resources/fill:
  post:
    tags:
    - City
    summary: GM 填满资源
    description: 将指定玩家的所有资源填满到仓库容量上限。
    operationId: fillResources
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - playerId
            properties:
              playerId:
                type: string
                example: player_47f23e0eeb08ab50402fedfc
    responses:
      '200':
        description: 资源已填满
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceActionResult'
      '404':
        description: 玩家不存在
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
/api/v1/city/boost/prices:
  get:
    tags:
    - City
    summary: 查询资源加成价格
    description: 返回当前配置开放的四档倍率与四档时长组合价格，键格式为倍率x_时长h，单位为城金。
    operationId: getBoostPrices
    responses:
      '200':
        description: 当前加成价格表
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoostPricesResponse'
/api/v1/city/capacity-boost:
  post:
    tags:
    - City
    summary: 购买仓库容量扩容
    description: 消耗城金购买仓库容量倍率。同倍率购买会在未到期时间上续时，不同倍率或已过期时从当前时间重新计算。
    operationId: purchaseCapacityBoost
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CapacityBoostRequest'
    responses:
      '200':
        description: 扩容成功，返回最新容量、倍率、到期时间、城金和实际费用
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceActionResult'
      '400':
        description: 倍率或持续时间不在当前配置中
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '404':
        description: 玩家不存在
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '422':
        description: 城金不足
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
