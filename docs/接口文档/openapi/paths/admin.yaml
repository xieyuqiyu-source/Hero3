/api/v1/admin/accounts:
  get:
    tags:
    - Admin
    summary: GM 查看所有注册账号和存档
    operationId: adminListAccounts
    responses:
      '200':
        description: 账号和存档列表
        content:
          application/json:
            schema:
              type: object
              required:
              - accounts
              properties:
                accounts:
                  type: array
                  items:
                    $ref: '#/components/schemas/AccountSummary'
      '500':
        description: 后端读取失败
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
/api/v1/admin/players/{playerId}/state:
  get:
    tags:
    - Admin
    summary: GM 查看指定玩家完整状态
    operationId: adminGetPlayerState
    parameters:
    - name: playerId
      in: path
      required: true
      schema:
        type: string
        example: player_47f23e0eeb08ab50402fedfc
    responses:
      '200':
        description: 玩家完整游戏状态
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameState'
      '404':
        description: 玩家不存在
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
/api/v1/admin/generals-config:
  get:
    tags:
    - Admin
    summary: GM 查看将领双特性配置
    operationId: adminGetGeneralsConfig
    responses:
      '200':
        description: 当前将领配置
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeneralsConfig'
  put:
    tags:
    - Admin
    summary: GM 保存将领双特性配置
    description: 每个启用将领必须同时配置 specialTrait 和 bonusTrait，参数必须符合后端 schema 上下限。
    operationId: adminUpdateGeneralsConfig
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GeneralsConfig'
    responses:
      '200':
        description: 保存后的将领配置
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeneralsConfig'
      '400':
        description: 配置校验失败
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
/api/v1/admin/general-traits:
  get:
    tags:
    - Admin
    summary: GM 查看已注册将领特性
    operationId: adminGetGeneralTraitRegistry
    responses:
      '200':
        description: 已注册特性及参数 schema
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TraitRegistryResponse'
/api/v1/admin/world-map/occupancy:
  get:
    tags:
    - Admin
    summary: GM 查看世界地图占用率
    operationId: adminGetWorldMapOccupancy
    security:
    - adminToken: []
    responses:
      '200':
        description: 世界地图坐标占用统计
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorldMapOccupancyStats'
/api/v1/admin/world-map/positions/check:
  get:
    tags:
    - Admin
    summary: GM 检查世界坐标占用
    description: 保存玩家世界坐标前，检查指定 0-99 坐标格是否已被玩家占用。
    operationId: adminCheckWorldCoordinate
    security:
    - adminToken: []
    parameters:
    - name: x
      in: query
      required: true
      schema:
        type: integer
        minimum: 0
        maximum: 99
    - name: y
      in: query
      required: true
      schema:
        type: integer
        minimum: 0
        maximum: 99
    responses:
      '200':
        description: 世界坐标占用状态
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorldMapCoordinateCheck'
      '400':
        description: 坐标越界
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
/api/v1/admin/world-map/positions/{playerId}:
  get:
    tags:
    - Admin
    summary: GM 查看玩家世界坐标
    operationId: adminGetWorldPosition
    security:
    - adminToken: []
    parameters:
    - name: playerId
      in: path
      required: true
      schema:
        type: string
    responses:
      '200':
        description: 玩家权威世界坐标
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorldPosition'
      '404':
        description: 玩家不存在
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
  put:
    tags:
    - Admin
    summary: GM 调整玩家世界坐标
    description: 将玩家城池移动到指定世界格子。坐标范围为 0-99，目标格已被其他玩家占用时会失败。
    operationId: adminUpdateWorldPosition
    security:
    - adminToken: []
    parameters:
    - name: playerId
      in: path
      required: true
      schema:
        type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - x
            - y
            properties:
              x:
                type: integer
                minimum: 0
                maximum: 99
              y:
                type: integer
                minimum: 0
                maximum: 99
    responses:
      '200':
        description: 调整后的玩家权威世界坐标
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorldPosition'
      '400':
        description: 坐标越界或目标格已占用
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '404':
        description: 玩家不存在
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
/api/v1/admin/resources/adjust:
  post:
    tags:
    - Admin
    summary: GM 资源补发 / 扣减
    description: 对指定玩家的资源进行加减调整。正数为补发，负数为扣减（不会低于 0，不会超过容量上限）。
    operationId: adminAdjustResources
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdjustResourcesRequest'
    responses:
      '200':
        description: 调整后的游戏状态
        content:
          application/json:
            schema:
              type: object
              required:
              - state
              properties:
                state:
                  $ref: '#/components/schemas/GameState'
      '400':
        description: 参数错误
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '404':
        description: 玩家不存在
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
/api/v1/admin/balance:
  get:
    tags:
    - Admin
    summary: GM 读取游戏数值配置
    operationId: adminGetBalance
    responses:
      '200':
        description: 当前资源和建筑数值配置
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BalanceConfig'
  put:
    tags:
    - Admin
    summary: GM 保存游戏数值配置
    operationId: adminUpdateBalance
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BalanceConfig'
    responses:
      '200':
        description: 保存后的数值配置
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BalanceConfig'
      '400':
        description: 配置格式或内容不合法
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
/api/v1/admin/npc-config:
  get:
    tags:
    - Admin
    summary: GM 读取 NPC 城池配置
    description: 读取 NPC 城池生成、刷新、守军、词条和侦查消耗配置。
    operationId: adminGetNpcConfig
    responses:
      '200':
        description: 当前 NPC 城池配置
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NpcConfig'
  put:
    tags:
    - Admin
    summary: GM 保存 NPC 城池配置
    description: 保存后立即更新后端内存配置。已生成到玩家存档内的 NPC 城池不会自动重刷，需要调用 NPC 刷新接口才会按新配置重新生成。
    operationId: adminUpdateNpcConfig
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NpcConfig'
    responses:
      '200':
        description: 保存后的 NPC 城池配置
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NpcConfig'
      '400':
        description: 配置格式或内容不合法
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
/api/v1/admin/fishing-config:
  get:
    tags:
    - Admin
    summary: GM 读取仙池垂钓配置
    description: 读取鱼池、鱼饵、稀有度概率权重配置。Web 端也会通过 game/bootstrap 获取同一份配置；线上优先读取数据库 game_configs.fishing，文件配置只作为默认模板。
    operationId: adminGetFishingConfig
    responses:
      '200':
        description: 当前钓鱼配置
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FishingConfig'
  put:
    tags:
    - Admin
    summary: GM 保存仙池垂钓配置
    description: 保存后写入数据库 game_configs.fishing 并立即更新后端内存配置，后续新进入钓鱼页面或刷新 bootstrap 的玩家会使用新鱼池和概率；不会回写发布目录中的 go/config/fishing.json。
    operationId: adminUpdateFishingConfig
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FishingConfig'
    responses:
      '200':
        description: 保存后的钓鱼配置
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FishingConfig'
      '400':
        description: 配置格式或内容不合法
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
/api/v1/admin/slot-config:
  get:
    tags:
    - Admin
    summary: GM 读取天机轮转配置
    description: 读取每线押注、赔付线、图案权重、倍率、免费旋转和宝匣倍率配置。Web 端也会通过 game/bootstrap 获取同一份配置。
    operationId: adminGetSlotConfig
    responses:
      '200':
        description: 当前天机轮转配置
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlotConfig'
  put:
    tags:
    - Admin
    summary: GM 保存天机轮转配置
    description: 保存后立即更新后端内存配置，后续新结算的天机轮转局会使用新权重和倍率。
    operationId: adminUpdateSlotConfig
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SlotConfig'
    responses:
      '200':
        description: 保存后的天机轮转配置
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlotConfig'
      '400':
        description: 配置格式或内容不合法
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
/api/v1/admin/yellow-turban/config:
  get:
    tags:
    - Admin
    summary: GM 读取黄巾起义配置
    description: 读取千帐营、黄巾检测、压力等级、地区兵种池和行军倍率配置。线上优先读取数据库 game_configs.yellow_turban。
    operationId: adminGetYellowTurbanConfig
    security:
    - adminToken: []
    responses:
      '200':
        description: 当前黄巾起义配置
        content:
          application/json:
            schema:
              type: object
  put:
    tags:
    - Admin
    summary: GM 保存黄巾起义配置
    description: 保存后写入数据库 game_configs.yellow_turban 并立即更新后端内存配置。
    operationId: adminUpdateYellowTurbanConfig
    security:
    - adminToken: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
    responses:
      '200':
        description: 保存后的黄巾起义配置
        content:
          application/json:
            schema:
              type: object
      '400':
        description: 配置格式或内容不合法
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
/api/v1/admin/yellow-turban/check-all:
  post:
    tags:
    - Admin
    summary: GM 手动触发全服黄巾检测
    description: 对所有玩家执行一次黄巾检测，超出千帐营上限且未达到来袭上限的玩家会新增黄巾来袭。
    operationId: adminCheckYellowTurbanAll
    security:
    - adminToken: []
    responses:
      '200':
        description: 全服检测结果
        content:
          application/json:
            schema:
              type: object
              properties:
                results:
                  type: array
                  items:
                    $ref: '#/components/schemas/YellowTurbanCheckResult'
