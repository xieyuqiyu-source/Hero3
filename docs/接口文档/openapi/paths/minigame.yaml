/api/v1/minigame/record:
  post:
    tags:
    - MiniGame
    summary: 保存小游戏记录
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MiniGameRecordRequest'
    responses:
      '201':
        description: 已创建记录
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MiniGameRecord'
/api/v1/minigame/records:
  get:
    tags:
    - MiniGame
    summary: 玩家查询自己的小游戏记录与库存
    parameters:
    - name: playerId
      in: query
      required: true
      schema:
        type: string
    - name: gameType
      in: query
      required: false
      schema:
        type: string
        enum: [fishing, gambling, slot]
      description: 按小游戏类型筛选；天机轮转库存传 slot。
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 100
        maximum: 500
    - name: offset
      in: query
      required: false
      schema:
        type: integer
        default: 0
    responses:
      '200':
        description: 小游戏记录汇总
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MiniGameSummary'
/api/v1/minigame/fishing/use-bait:
  post:
    tags: [MiniGame]
    summary: 使用钓鱼鱼饵
    description: 扣除城金后返回货币局部结果，不再返回完整 GameState。
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [playerId, baitId]
            properties:
              playerId:
                type: string
              baitId:
                type: string
    responses:
      '200':
        description: 鱼饵使用成功
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FishingBaitUseResult'
/api/v1/minigame/slot/resolve:
  post:
    tags: [MiniGame]
    summary: 结算一局天机轮转
    description: 后端校验押注兵种和数量，扣除押注兵力，服务器抽取三轴图案并写入 slot 小游戏记录。
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [playerId, betUnitType, betAmount]
            properties:
              playerId:
                type: string
              betUnitType:
                type: string
                description: 押注兵种 ID。
                example: qiQiYing
              betAmount:
                type: integer
                minimum: 1000
                example: 10000
    responses:
      '200':
        description: 结算成功
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlotRoundResult'
      '404':
        description: 存档不存在
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '422':
        description: 押注兵种不存在、押注不足、超过上限或兵种不能押注
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '429':
        description: 同一存档操作过快
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
/api/v1/minigame/redeem:
  post:
    tags:
    - MiniGame
    summary: 兑换小游戏库存奖励
    description: 钓鱼奖励兑换时，本阵营兵种进入常规军队，非本阵营兵种进入编外驻防队伍。
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MiniGameRedeemRequest'
    responses:
      '200':
        description: 兑换成功
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MiniGameRedeemResult'
      '400':
        description: 库存不足、兵种配置不存在或请求非法
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
/api/v1/minigame/redeem-all:
  post:
    tags:
    - MiniGame
    summary: 一键兑换小游戏库存奖励
    description: 扫描指定小游戏库存；本阵营兵种进入常规军队，非本阵营兵种进入编外驻防队伍。
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - playerId
            properties:
              playerId:
                type: string
              gameType:
                type: string
                enum: [fishing, gambling, slot]
                default: fishing
    responses:
      '200':
        description: 一键兑换完成
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MiniGameRedeemAllResult'
      '400':
        description: 请求非法
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
/api/v1/admin/minigame/records:
  get:
    tags:
    - Admin
    summary: GM 查询玩家万象幻境记录
    parameters:
    - name: playerId
      in: query
      required: true
      schema:
        type: string
    - name: gameType
      in: query
      required: false
      schema:
        type: string
        enum: [fishing, gambling, slot]
      description: 按小游戏类型筛选；不传则返回全部小游戏记录。
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 100
        maximum: 500
    - name: offset
      in: query
      required: false
      schema:
        type: integer
        default: 0
    responses:
      '200':
        description: 小游戏记录汇总
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MiniGameSummary'
