/api/v1/world-map/view:
  get:
    tags:
    - Map
    summary: 获取世界地图玩家城池视野
    description: 按玩家权威世界坐标返回指定格子视野内的玩家城池。接口不返回兵力、资源、武将或驻防详情。
    security:
    - bearerAuth: []
    operationId: getWorldMapView
    parameters:
    - name: playerId
      in: query
      required: true
      description: 查看地图的玩家存档 ID。
      schema:
        type: string
    - name: centerX
      in: query
      required: false
      description: 视野中心 X；不传或越界时使用自己城池 X。
      schema:
        type: integer
        minimum: 0
        maximum: 99
    - name: centerY
      in: query
      required: false
      description: 视野中心 Y；不传或越界时使用自己城池 Y。
      schema:
        type: integer
        minimum: 0
        maximum: 99
    - name: radius
      in: query
      required: false
      description: 视野半径，默认 10，最大 100；前端可用 100 一次加载第一版 100x100 地图玩家城池并本地裁剪显示。
      schema:
        type: integer
        minimum: 1
        maximum: 100
    responses:
      '200':
        description: 世界地图玩家城池视图
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorldMapViewResponse'
      '401':
        description: 未登录或登录凭证无效
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '403':
        description: 当前账号不拥有该玩家存档
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '404':
        description: 玩家不存在
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
/api/v1/world-map/targets/player_city/{playerId}:
  get:
    tags:
    - Map
    summary: 获取世界地图玩家城池目标详情
    description: 返回指定玩家城池在查看者视角下的地图目标详情。第一版不返回兵力、资源、武将或驻防详情。
    security:
    - bearerAuth: []
    operationId: getWorldMapPlayerCityTarget
    parameters:
    - name: playerId
      in: path
      required: true
      description: 目标玩家存档 ID。
      schema:
        type: string
    - name: viewerId
      in: query
      required: true
      description: 查看地图的玩家存档 ID。
      schema:
        type: string
    responses:
      '200':
        description: 玩家城池目标详情
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorldMapTarget'
      '401':
        description: 未登录或登录凭证无效
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '403':
        description: 当前账号不拥有查看者玩家存档
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '404':
        description: 查看者或目标玩家不存在
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
/api/v1/map/npc-cities:
  get:
    tags:
    - Map
    summary: 获取 NPC 城池列表
    description: 按玩家存档读取 NPC 城池状态。若该玩家尚未生成 NPC 城池，或已超过刷新周期，后端会生成并保存新的 NPC 状态。
    operationId: getNpcCities
    parameters:
    - name: playerId
      in: query
      required: true
      description: 玩家存档 ID。
      schema:
        type: string
        example: player_47f23e0eeb08ab50402fedfc
    responses:
      '200':
        description: NPC 城池状态
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NpcState'
      '404':
        description: 玩家不存在
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
/api/v1/map/npc-cities/refresh:
  post:
    tags:
    - Map
    summary: 手动刷新 NPC 城池
    description: 重新生成该玩家的 NPC 城池列表。金币消耗暂未接入，当前用于开发和 GM 验证。
    operationId: refreshNpcCities
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NpcCitiesRefreshRequest'
    responses:
      '200':
        description: 刷新后的 NPC 城池状态
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NpcState'
      '404':
        description: 玩家不存在
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
/api/v1/map/npc-cities/attack:
  post:
    tags:
    - Map
    summary: 攻击或掠夺 NPC 城池
    description: 扣除出征兵力，执行战斗结算，归还存活兵力，更新 NPC 守军、NPC 资源和玩家资源，只返回战斗影响范围内的局部状态。
    operationId: attackNpcCity
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AttackNpcRequest'
    responses:
      '200':
        description: 战斗结算结果和局部状态
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttackNpcResponse'
      '400':
        description: 参数错误或未选择出征兵力
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '404':
        description: 玩家、NPC 城池或兵种不存在
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '422':
        description: 出征兵力不足
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
/api/v1/map/npc-cities/scout:
  post:
    tags:
    - Map
    summary: 侦查 NPC 城池
    description: 消耗侦察兵，返回目标 NPC 城池完整信息和侦查影响范围内的局部状态。
    operationId: scoutNpcCity
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ScoutNpcRequest'
    responses:
      '200':
        description: 侦查结果和局部状态
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoutNpcResponse'
      '400':
        description: 参数错误或没有可用侦察兵种
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '404':
        description: 玩家或 NPC 城池不存在
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '422':
        description: 侦察兵数量不足
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
