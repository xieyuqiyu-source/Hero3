/api/v1/items/config:
  get:
    tags: [Game]
    summary: 查询道具配置
    responses:
      '200':
        description: 道具配置
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: object
/api/v1/items/use:
  post:
    tags: [Game]
    summary: 使用道具
    description: 返回局部补丁，不再返回完整 GameState。
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [playerId, itemId, amount]
            properties:
              playerId:
                type: string
              itemId:
                type: string
              amount:
                type: integer
                minimum: 1
    responses:
      '200':
        description: 使用成功
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UseItemResult'
/api/v1/admin/items/config:
  get:
    tags: [Admin]
    summary: GM 查询物品配置
    responses:
      '200':
        description: 物品配置
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: object
  put:
    tags: [Admin]
    summary: GM 保存物品配置
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties:
              type: object
    responses:
      '200':
        description: 保存后的物品配置
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: object
/api/v1/admin/items/config/validate:
  post:
    tags: [Admin]
    summary: GM 校验物品配置
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties:
              type: object
    responses:
      '200':
        description: 校验结果
        content:
          application/json:
            schema:
              type: object
              properties:
                ok:
                  type: boolean
                error:
                  type: string
/api/v1/admin/items/drop-pools:
  get:
    tags: [Admin]
    summary: GM 查询掉落池配置
    responses:
      '200':
        description: 掉落池配置
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: object
  put:
    tags: [Admin]
    summary: GM 保存掉落池配置
    description: 保存后立即影响后续 NPC、副本、宝箱等引用掉落池的奖励结算。
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties:
              type: object
    responses:
      '200':
        description: 保存后的掉落池配置
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: object
      '400':
        description: 配置格式或内容不合法
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
/api/v1/admin/items/drop-pools/validate:
  post:
    tags: [Admin]
    summary: GM 校验掉落池配置
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties:
              type: object
    responses:
      '200':
        description: 校验结果
        content:
          application/json:
            schema:
              type: object
              properties:
                ok:
                  type: boolean
                error:
                  type: string
/api/v1/admin/items/inventory:
  get:
    tags: [Admin]
    summary: GM 查询玩家背包
    parameters:
    - in: query
      name: playerId
      required: true
      schema:
        type: string
    responses:
      '200':
        description: 背包视图
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryView'
/api/v1/admin/items/ledger:
  get:
    tags: [Admin]
    summary: GM 查询物品流水
    parameters:
    - in: query
      name: playerId
      schema:
        type: string
    - in: query
      name: itemId
      schema:
        type: string
    - in: query
      name: refType
      schema:
        type: string
    responses:
      '200':
        description: 物品流水分页
        content:
          application/json:
            schema:
              type: object
