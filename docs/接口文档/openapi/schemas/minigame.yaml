MiniGameRecord:
  type: object
  required:
  - id
  - playerId
  - gameType
  - resultName
  - rarity
  - rewardUnit
  - rewardAmount
  - remainingAmount
  - createdAt
  properties:
    id:
      type: string
      example: mg_47f23e0eeb08ab5040
    playerId:
      type: string
    gameType:
      type: string
      enum: [fishing, gambling]
    resultName:
      type: string
      example: 金龙鱼
    rarity:
      type: string
      enum: [common, rare, epic, legendary]
    rewardUnit:
      type: string
      example: 骁骑营
    rewardAmount:
      type: integer
      description: 原始钓获或赢得数量。
      example: 5000
    remainingAmount:
      type: integer
      description: 剩余可兑换库存；为 0 时表示已消耗完。
      example: 3000
    betUnit:
      type: string
    betAmount:
      type: integer
    createdAt:
      type: string
      format: date-time
MiniGameSummary:
  type: object
  required:
  - totalRecords
  - limit
  - offset
  - hasMore
  - records
  - rewardTotals
  properties:
    totalRecords:
      type: integer
      description: 符合筛选条件的记录总数，不是当前页条数。
    limit:
      type: integer
      description: 当前页请求条数上限。
    offset:
      type: integer
      description: 当前页偏移量。
    hasMore:
      type: boolean
      description: 是否还有下一页。
    records:
      type: array
      items:
        $ref: '#/components/schemas/MiniGameRecord'
    rewardTotals:
      type: object
      description: 按剩余可兑换数量汇总。
      additionalProperties:
        type: integer
MiniGameRecordRequest:
  type: object
  required:
  - playerId
  - gameType
  - resultName
  properties:
    playerId:
      type: string
    gameType:
      type: string
      enum: [fishing, gambling]
    resultName:
      type: string
    rarity:
      type: string
    rewardUnit:
      type: string
    rewardAmount:
      type: integer
    betUnit:
      type: string
    betAmount:
      type: integer
MiniGameRedeemRequest:
  type: object
  required:
  - playerId
  - recordId
  - amount
  properties:
    playerId:
      type: string
    recordId:
      type: string
    amount:
      type: integer
      minimum: 1
MiniGameRedeemResult:
  type: object
  required:
  - record
  - state
  - redeemedUnitId
  - redeemedUnit
  - redeemedAmount
  properties:
    record:
      $ref: '#/components/schemas/MiniGameRecord'
    state:
      $ref: '#/components/schemas/GameState'
    redeemedUnitId:
      type: string
      example: qiQiYing
    redeemedUnit:
      type: string
      example: 骁骑营
    redeemedAmount:
      type: integer
FishingConfig:
  type: object
  required:
  - rarities
  - baits
  - fishPool
  properties:
    rarities:
      type: object
      description: 稀有度配置，key 一般为 common / rare / epic / legendary。
      additionalProperties:
        $ref: '#/components/schemas/FishingRarityConfig'
    baits:
      type: array
      items:
        $ref: '#/components/schemas/FishingBaitConfig'
    fishPool:
      type: array
      items:
        $ref: '#/components/schemas/FishingFishConfig'
FishingRarityConfig:
  type: object
  required:
  - label
  - weight
  properties:
    label:
      type: string
      example: 稀有
    color:
      type: string
    bg:
      type: string
    border:
      type: string
    weight:
      type: number
      format: double
      description: 抽取该稀有度的基础权重。
      example: 22
    glow:
      type: string
FishingBaitConfig:
  type: object
  required:
  - id
  - name
  - rarityBoost
  - cityGoldCost
  - biteChance
  - biteWindowMs
  - sweetStart
  - sweetEnd
  properties:
    id:
      type: string
      example: golden
    name:
      type: string
      example: 金鳞饵
    tier:
      type: string
      example: 三阶
    description:
      type: string
    rarityBoost:
      type: number
      format: double
      description: 稀有、史诗、传说权重倍率。
    cityGoldCost:
      type: integer
      minimum: 0
    biteChance:
      type: number
      format: double
      minimum: 0
      maximum: 1
    biteWindowMs:
      type: integer
      minimum: 1
    sweetStart:
      type: integer
      minimum: 0
      maximum: 100
    sweetEnd:
      type: integer
      minimum: 0
      maximum: 100
FishingFishConfig:
  type: object
  required:
  - name
  - rarity
  - reward
  - rewardAmount
  properties:
    name:
      type: string
      example: 神龙
    rarity:
      type: string
      example: legendary
    reward:
      type: string
      description: 绑定的奖励兵种名称。
      example: 士族
    rewardAmount:
      type: integer
      minimum: 1
    description:
      type: string
    emoji:
      type: string
      example: 1000
