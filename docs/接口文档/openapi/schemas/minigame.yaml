MiniGameRecord:
  type: object
  required:
  - id
  - playerId
  - gameType
  - resultName
  - rarity
  - rewardUnit
  - rewardAmount
  - remainingAmount
  - createdAt
  properties:
    id:
      type: string
      example: mg_47f23e0eeb08ab5040
    playerId:
      type: string
    gameType:
      type: string
      enum: [fishing, gambling, slot]
    resultName:
      type: string
      example: 金龙鱼
    rarity:
      type: string
      enum: [common, rare, epic, legendary]
    rewardUnit:
      type: string
      example: 骁骑营
    rewardAmount:
      type: integer
      description: 原始钓获或赢得数量。
      example: 5000
    remainingAmount:
      type: integer
      description: 剩余可兑换库存；为 0 时表示已消耗完。
      example: 3000
    betUnit:
      type: string
    betAmount:
      type: integer
    createdAt:
      type: string
      format: date-time
MiniGameSummary:
  type: object
  required:
  - totalRecords
  - limit
  - offset
  - hasMore
  - records
  - rewardTotals
  properties:
    totalRecords:
      type: integer
      description: 符合筛选条件的记录总数，不是当前页条数。
    limit:
      type: integer
      description: 当前页请求条数上限。
    offset:
      type: integer
      description: 当前页偏移量。
    hasMore:
      type: boolean
      description: 是否还有下一页。
    records:
      type: array
      items:
        $ref: '#/components/schemas/MiniGameRecord'
    rewardTotals:
      type: object
      description: 按剩余可兑换数量汇总。
      additionalProperties:
        type: integer
MiniGameRecordRequest:
  type: object
  required:
  - playerId
  - gameType
  - resultName
  properties:
    playerId:
      type: string
    gameType:
      type: string
      enum: [fishing, gambling, slot]
    resultName:
      type: string
    rarity:
      type: string
    rewardUnit:
      type: string
    rewardAmount:
      type: integer
    betUnit:
      type: string
    betAmount:
      type: integer
MiniGameRedeemRequest:
  type: object
  required:
  - playerId
  - recordId
  - amount
  properties:
    playerId:
      type: string
    recordId:
      type: string
    amount:
      type: integer
      minimum: 1
MiniGameRedeemResult:
  type: object
  required:
  - record
  - serverTime
  - redeemedUnitId
  - redeemedUnit
  - redeemedAmount
  - redeemedTarget
  properties:
    record:
      $ref: '#/components/schemas/MiniGameRecord'
    army:
      type: array
      description: 本次兑换后需要局部刷新到前端的常规军队。
      items:
        $ref: '#/components/schemas/ArmyUnit'
    serverTime:
      type: string
      format: date-time
    redeemedUnitId:
      type: string
      example: qiQiYing
    redeemedUnit:
      type: string
      example: 骁骑营
    redeemedAmount:
      type: integer
    redeemedTarget:
      type: string
      enum: [army, garrison]
      description: army 表示进入常规军队，garrison 表示进入编外驻防队伍。
    garrison:
      $ref: '#/components/schemas/Reinforcement'
MiniGameRedeemAllResult:
  type: object
  required:
  - serverTime
  - redeemedUnits
  - redeemedAmount
  - redeemedRecords
  - skippedUnits
  - skippedRecords
  properties:
    army:
      type: array
      description: 批量兑换后需要局部刷新到前端的常规军队。
      items:
        $ref: '#/components/schemas/ArmyUnit'
    serverTime:
      type: string
      format: date-time
    redeemedUnits:
      type: object
      description: 进入常规军队的兵种汇总。
      additionalProperties:
        type: integer
    redeemedAmount:
      type: integer
      description: 总兑换数量，包含进入常规军队和进入驻防队伍的数量。
    redeemedRecords:
      type: integer
    garrisonedUnits:
      type: object
      description: 进入编外驻防队伍的兵种汇总。
      additionalProperties:
        type: integer
    garrisonRecords:
      type: integer
    skippedUnits:
      type: object
      description: 因配置不存在等原因跳过的库存。
      additionalProperties:
        type: integer
    skippedRecords:
      type: integer
SlotRoundResult:
  type: object
  required:
  - record
  - serverTime
  - won
  - grid
  - lineBet
  - lineCount
  - totalBet
  - winningLines
  - freeSpins
  - bonusRewards
  - allPayRewards
  - betUnitId
  - betUnit
  - betAmount
  - winAmount
  properties:
    record:
      $ref: '#/components/schemas/MiniGameRecord'
    army:
      type: array
      description: 本局扣除押注后的最新军队。
      items:
        $ref: '#/components/schemas/ArmyUnit'
    serverTime:
      type: string
      format: date-time
    won:
      type: boolean
    grid:
      type: array
      description: 3x3 行优先结果矩阵，外层为上/中/下三行，内层为左/中/右三轮。
      items:
        type: array
        items:
          type: string
      example:
      - [bronze_charm, silver_charm, tiger_tally]
      - [gold_charm, gold_charm, gold_charm]
      - [scatter, jade_seal, bonus]
    lineBet:
      type: integer
      description: 单次押注数量；历史字段名保留为 lineBet，但本局扣兵不再乘以线数。
      example: 10000
    lineCount:
      type: integer
      example: 5
    totalBet:
      type: integer
      description: 本局实际扣除数量，当前与 lineBet 相同。
      example: 10000
    winningLines:
      type: array
      items:
        $ref: '#/components/schemas/SlotWinningLine'
    freeSpins:
      type: array
      items:
        $ref: '#/components/schemas/SlotFreeSpinResult'
    bonusRewards:
      type: array
      items:
        $ref: '#/components/schemas/SlotBonusReward'
    allPayRewards:
      type: array
      description: 满天星奖励；同局只返回收益最高的一组。
      items:
        $ref: '#/components/schemas/SlotAllPayReward'
    betUnitId:
      type: string
      example: qiQiYing
    betUnit:
      type: string
      example: 骁骑营
    betAmount:
      type: integer
      description: 与 totalBet 相同，用于兼容小游戏记录展示。
      example: 10000
    winAmount:
      type: integer
      example: 120000
    rewardRarity:
      type: string
      enum: [common, rare, epic, legendary]
SlotWinningLine:
  type: object
  required: [lineId, symbol, symbolName, multiplier, amount, positions]
  properties:
    lineId:
      type: string
      enum: [middle, top, bottom, diagonal_down, diagonal_up]
    symbol:
      type: string
      example: gold_charm
    symbolName:
      type: string
      example: 赤金符
    multiplier:
      type: integer
      example: 12
    amount:
      type: integer
      example: 120000
    positions:
      type: array
      items:
        type: array
        items:
          type: integer
      example:
      - [1, 0]
      - [1, 1]
      - [1, 2]
SlotBonusReward:
  type: object
  required: [multiplier, amount, positions]
  properties:
    multiplier:
      type: integer
      example: 20
    amount:
      type: integer
      example: 200000
    positions:
      type: array
      description: 触发宝匣奖励的 3 个坐标；天机令补齐宝匣时会包含天机令坐标。
      items:
        type: array
        items:
          type: integer
      example:
      - [0, 0]
      - [1, 1]
      - [2, 2]
SlotAllPayReward:
  type: object
  required: [symbol, symbolName, count, multiplier, amount, positions]
  properties:
    symbol:
      type: string
      example: gold_charm
    symbolName:
      type: string
      example: 赤金符
    count:
      type: integer
      description: 同类普通图案加天机令补齐后的数量。
      example: 5
    multiplier:
      type: integer
      description: 最终奖励倍率，已包含图案倍率和满天星数量系数。
      example: 24
    amount:
      type: integer
      example: 240000
    positions:
      type: array
      description: 满天星使用的图案坐标；天机令补齐时会包含天机令坐标。
      items:
        type: array
        items:
          type: integer
      example:
      - [0, 0]
      - [1, 2]
      - [2, 0]
      - [2, 2]
      - [1, 0]
SlotFreeSpinResult:
  type: object
  required: [spinIndex, grid, winningLines, bonusRewards, allPayRewards, scatterCount, retriggeredFreeSpins, winAmount]
  properties:
    spinIndex:
      type: integer
      example: 1
    grid:
      type: array
      items:
        type: array
        items:
          type: string
    winningLines:
      type: array
      items:
        $ref: '#/components/schemas/SlotWinningLine'
    bonusRewards:
      type: array
      items:
        $ref: '#/components/schemas/SlotBonusReward'
    allPayRewards:
      type: array
      items:
        $ref: '#/components/schemas/SlotAllPayReward'
    scatterCount:
      type: integer
      example: 3
    retriggeredFreeSpins:
      type: integer
      example: 3
    winAmount:
      type: integer
      example: 800000
SlotConfig:
  type: object
  required:
  - minLineBet
  - lineCount
  - maxFreeSpinsPerRound
  - symbols
  properties:
    minLineBet:
      type: integer
      example: 1000
    lineCount:
      type: integer
      example: 5
    maxFreeSpinsPerRound:
      type: integer
      example: 20
    symbols:
      type: array
      items:
        $ref: '#/components/schemas/SlotSymbolConfig'
SlotBonusMultiplierConfig:
  type: object
  required: [multiplier, weight]
  properties:
    multiplier:
      type: integer
      example: 20
    weight:
      type: integer
      example: 15
SlotSymbolConfig:
  type: object
  required:
  - id
  - name
  - rarity
  - type
  - weight
  properties:
    id:
      type: string
      example: gold_charm
    name:
      type: string
      example: 赤金符
    rarity:
      type: string
      enum: [common, rare, epic, legendary]
    type:
      type: string
      enum: [normal, wild, scatter, bonus]
    weight:
      type: integer
      example: 16
    multiplier:
      type: integer
      example: 12
    freeSpins:
      type: integer
      example: 5
    retriggerFreeSpins:
      type: integer
      example: 3
    bonusMultipliers:
      type: array
      items:
        $ref: '#/components/schemas/SlotBonusMultiplierConfig'
FishingConfig:
  type: object
  required:
  - rarities
  - baits
  - fishPool
  properties:
    rarities:
      type: object
      description: 稀有度配置，key 一般为 common / rare / epic / legendary / mythic。
      additionalProperties:
        $ref: '#/components/schemas/FishingRarityConfig'
    baits:
      type: array
      items:
        $ref: '#/components/schemas/FishingBaitConfig'
    fishPool:
      type: array
      items:
        $ref: '#/components/schemas/FishingFishConfig'
FishingRarityConfig:
  type: object
  required:
  - label
  - weight
  properties:
    label:
      type: string
      example: 稀有
    color:
      type: string
    bg:
      type: string
    border:
      type: string
    weight:
      type: number
      format: double
      description: 抽取该稀有度的基础权重。
      example: 22
    glow:
      type: string
FishingBaitConfig:
  type: object
  required:
  - id
  - name
  - rarityBoost
  - cityGoldCost
  - biteChance
  - biteWindowMs
  - sweetStart
  - sweetEnd
  properties:
    id:
      type: string
      example: golden
    name:
      type: string
      example: 金鳞饵
    tier:
      type: string
      example: 三阶
    description:
      type: string
    rarityBoost:
      type: number
      format: double
      description: 旧版稀有、史诗、传说权重倍率；未配置 rarityWeights 时用于兼容旧概率模型。
    rarityWeights:
      type: object
      description: 当前鱼饵独立品质权重；存在时优先于 rarityBoost，可用于让顶级饵料主要产出传说和神话。
      additionalProperties:
        type: number
        format: double
      example:
        common: 0
        rare: 5
        epic: 25
        legendary: 65
        mythic: 5
    minRarity:
      type: string
      description: 当前鱼饵允许抽到的最低品质。
      example: rare
    maxRarity:
      type: string
      description: 当前鱼饵允许抽到的最高品质。
      example: mythic
    biteDelayMultiplier:
      type: number
      format: double
      description: 咬钩等待时间倍率；为空或 0 时使用旧版 rarityBoost 等待时间公式。
      example: 0.65
    cityGoldCost:
      type: integer
      minimum: 0
    biteChance:
      type: number
      format: double
      minimum: 0
      maximum: 1
    biteWindowMs:
      type: integer
      minimum: 1
    sweetStart:
      type: integer
      minimum: 0
      maximum: 100
    sweetEnd:
      type: integer
      minimum: 0
      maximum: 100
FishingFishConfig:
  type: object
  required:
  - name
  - rarity
  - reward
  - rewardAmount
  properties:
    name:
      type: string
      example: 神龙
    rarity:
      type: string
      example: legendary
    reward:
      type: string
      description: 绑定的奖励兵种名称。
      example: 士族
    rewardAmount:
      type: integer
      minimum: 1
    description:
      type: string
    emoji:
      type: string
      example: 1000
