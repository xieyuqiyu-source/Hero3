GameState:
  type: object
  required:
  - player
  - resources
  - resourceProduction
  - resourceSettledAt
  - buildings
  - army
  - recruitQueues
  - mapTargets
  - recentBattleReports
  - unreadMessageCount
  - unreadMailCount
  - serverTime
  properties:
    player:
      $ref: '#/components/schemas/Player'
    resources:
      $ref: '#/components/schemas/ResourceState'
    inventory:
      type: object
      description: 玩家背包快照，key 为道具 ID。
      additionalProperties:
        $ref: '#/components/schemas/ItemStack'
    resourceProduction:
      $ref: '#/components/schemas/ResourceProduction'
    resourceSettledAt:
      type: string
      format: date-time
      description: 资源上次由后端权威结算的时间。
    cityGold:
      type: integer
      description: 城内金币，主要用于加速和城内消费。
      example: 120
    productionBoost:
      type: integer
      description: 资源产量加成倍率，0 或 1 表示无加成。
      example: 2
    productionBoostEnd:
      type: string
      description: 资源产量加成到期时间。
      example: '2026-06-26T12:00:00Z'
    capacityBoost:
      type: integer
      description: 资源容量加成倍率，0 或 1 表示无加成。
      example: 2
    capacityBoostEnd:
      type: string
      description: 资源容量加成到期时间。
      example: '2026-06-26T12:00:00Z'
    buildings:
      type: array
      items:
        $ref: '#/components/schemas/Building'
    resourceSlots:
      type: array
      description: 玩家资源田格子快照，权威来源为 player_resource_slots。
      items:
        $ref: '#/components/schemas/ResourceSlot'
    army:
      type: array
      items:
        $ref: '#/components/schemas/ArmyUnit'
    recruitQueues:
      type: array
      items:
        $ref: '#/components/schemas/RecruitQueue'
    general:
      nullable: true
      allOf:
      - $ref: '#/components/schemas/General'
    generals:
      type: array
      description: 玩家已拥有武将快照，权威来源为 player_generals。
      items:
        $ref: '#/components/schemas/General'
    generalAssignments:
      type: array
      description: 武将上阵、驻守、派遣等占用快照，权威来源为 player_general_assignments。
      items:
        $ref: '#/components/schemas/GeneralAssignment'
    buffs:
      type: array
      description: 玩家动态 Buff/Modifier 快照，权威来源为 player_buffs。
      items:
        $ref: '#/components/schemas/Buff'
    npcState:
      nullable: true
      allOf:
      - $ref: '#/components/schemas/NpcState'
    mapTargets:
      type: array
      items:
        $ref: '#/components/schemas/MapTarget'
    recentBattleReports:
      type: array
      description: 兼容字段。军情列表已拆到 /api/v1/news/reports 分页接口，game/state 默认返回空数组。
      items:
        $ref: '#/components/schemas/BattleReport'
    unreadMessageCount:
      type: integer
      example: 0
    unreadMailCount:
      type: integer
      example: 0
    activeModifiers:
      type: array
      description: 当前生效加成明细，按来源拆分。
      items:
        $ref: '#/components/schemas/ModifierBreakdownItem'
    serverTime:
      type: string
      format: date-time
PlayerSummaryView:
  type: object
  required:
  - player
  - cityGold
  - unreadMessageCount
  - unreadMailCount
  - serverTime
  properties:
    player:
      $ref: '#/components/schemas/Player'
    cityGold:
      type: integer
      example: 120
    unreadMessageCount:
      type: integer
      example: 0
    unreadMailCount:
      type: integer
      example: 0
    serverTime:
      type: string
      format: date-time
CityView:
  type: object
  required:
  - player
  - buildings
  - resources
  - resourceProduction
  - cityGold
  - serverTime
  properties:
    player:
      $ref: '#/components/schemas/Player'
    buildings:
      type: array
      items:
        $ref: '#/components/schemas/Building'
    resourceSlots:
      type: array
      items:
        $ref: '#/components/schemas/ResourceSlot'
    resources:
      $ref: '#/components/schemas/ResourceState'
    resourceProduction:
      $ref: '#/components/schemas/ResourceProduction'
    cityGold:
      type: integer
      example: 120
    activeModifiers:
      type: array
      items:
        $ref: '#/components/schemas/ModifierBreakdownItem'
    serverTime:
      type: string
      format: date-time
ResourceView:
  type: object
  required:
  - resources
  - resourceProduction
  - resourceSettledAt
  - serverTime
  properties:
    resources:
      $ref: '#/components/schemas/ResourceState'
    resourceProduction:
      $ref: '#/components/schemas/ResourceProduction'
    resourceSettledAt:
      type: string
      format: date-time
    productionBoost:
      type: integer
      example: 2
    productionBoostEnd:
      type: string
      example: '2026-06-26T12:00:00Z'
    capacityBoost:
      type: integer
      example: 2
    capacityBoostEnd:
      type: string
      example: '2026-06-26T12:00:00Z'
    activeModifiers:
      type: array
      items:
        $ref: '#/components/schemas/ModifierBreakdownItem'
    serverTime:
      type: string
      format: date-time
MilitaryView:
  type: object
  required:
  - army
  - recruitQueues
  - serverTime
  properties:
    army:
      type: array
      items:
        $ref: '#/components/schemas/ArmyUnit'
    recruitQueues:
      type: array
      items:
        $ref: '#/components/schemas/RecruitQueue'
    general:
      nullable: true
      allOf:
      - $ref: '#/components/schemas/General'
    generals:
      type: array
      items:
        $ref: '#/components/schemas/General'
    generalAssignments:
      type: array
      items:
        $ref: '#/components/schemas/GeneralAssignment'
    serverTime:
      type: string
      format: date-time
InventoryView:
  type: object
  required:
  - inventory
  - serverTime
  properties:
    inventory:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/ItemStack'
    serverTime:
      type: string
      format: date-time
GeneralsView:
  type: object
  required:
  - serverTime
  properties:
    general:
      nullable: true
      allOf:
      - $ref: '#/components/schemas/General'
    generals:
      type: array
      items:
        $ref: '#/components/schemas/General'
    generalAssignments:
      type: array
      items:
        $ref: '#/components/schemas/GeneralAssignment'
    activeModifiers:
      type: array
      items:
        $ref: '#/components/schemas/ModifierBreakdownItem'
    serverTime:
      type: string
      format: date-time
Player:
  type: object
  required:
  - id
  - nickname
  - faction
  properties:
    id:
      type: string
      example: player_47f23e0eeb08ab50402fedfc
    nickname:
      type: string
      example: 主公
    mailCode:
      type: string
      description: 玩家信函短编号，与昵称组合成 玩家昵称#编号。
      example: '482193'
    faction:
      type: string
      example: wei
ResourceState:
  type: object
  required:
  - items
  - capacity
  properties:
    items:
      type: object
      description: 资源当前数量，key 为资源类型，可扩展。
      additionalProperties:
        type: integer
      example:
        wood: 1200
        stone: 900
        iron: 600
        food: 1500
    capacity:
      type: object
      description: 各资源容量上限，key 与资源类型一致。
      additionalProperties:
        type: integer
      example:
        wood: 7500
        stone: 7500
        iron: 7500
        food: 7500
ResourceProduction:
  type: object
  description: 每小时资源产量，key 为资源类型，可扩展。
  additionalProperties:
    type: integer
  example:
    wood: 84
    stone: 62
    iron: 48
    food: 100
ItemStack:
  type: object
  required:
  - itemId
  - amount
  properties:
    itemId:
      type: string
      example: general_exp_small
    amount:
      type: integer
      example: 3
    obtainedAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
Building:
  type: object
  required:
  - id
  - type
  - level
  - upgradeEndsAt
  properties:
    id:
      type: string
      example: wood-camp
    type:
      type: string
      example: wood_camp
    level:
      type: integer
      example: 3
    status:
      type: string
      example: upgrading
    upgradeEndsAt:
      type: string
      nullable: true
      example: null
    statusEndsAt:
      type: string
      nullable: true
      example: null
ResourceSlot:
  type: object
  required:
  - id
  - resourceType
  properties:
    id:
      type: string
      example: construction_resource_slot-1
    resourceType:
      type: string
      example: wood
    buildingId:
      type: string
      example: construction_resource_slot-1
    unlockedBy:
      type: string
      example: construction_bureau
    unlockedAt:
      type: string
      format: date-time
      example: '2026-06-26T12:00:00Z'
ArmyUnit:
  type: object
  required:
  - unitType
  - amount
  properties:
    unitType:
      type: string
      example: infantry
    amount:
      type: integer
      example: 80
RecruitQueue:
  type: object
  required:
  - id
  - unitType
  - amount
  - endsAt
  properties:
    id:
      type: string
    unitType:
      type: string
    amount:
      type: integer
    endsAt:
      type: string
      format: date-time
General:
  type: object
  required:
  - id
  - name
  - level
  - exp
  properties:
    id:
      type: string
      example: caocao
    name:
      type: string
      example: 曹操
    level:
      type: integer
      example: 1
    exp:
      type: integer
      example: 0
    nextLevelExp:
      type: integer
      example: 100
    availableStatPoints:
      type: integer
      example: 1
    stats:
      type: object
      additionalProperties:
        type: integer
    attributes:
      type: object
      additionalProperties:
        type: number
    buffs:
      type: object
      additionalProperties:
        type: number
GeneralAssignment:
  type: object
  required:
  - id
  - generalId
  - slot
  properties:
    id:
      type: string
      example: main
    generalId:
      type: string
      example: caocao
    slot:
      type: string
      example: main
    moduleId:
      type: string
      example: dungeon_famous_generals
    status:
      type: string
      example: active
    assignedAt:
      type: string
      format: date-time
    endsAt:
      type: string
      format: date-time
Buff:
  type: object
  required:
  - id
  - source
  - key
  - value
  - mode
  - createdAt
  properties:
    id:
      type: string
      example: buff_ab12cd34
    source:
      type: string
      example: gm
    key:
      type: string
      example: attackBonus
    value:
      type: number
      example: 0.1
    mode:
      type: string
      example: percentAdd
    expiresAt:
      type: string
      format: date-time
    createdAt:
      type: string
      format: date-time
    note:
      type: string
      example: 活动奖励
ModifierBreakdownItem:
  type: object
  required:
  - source
  - key
  - value
  - mode
  properties:
    source:
      type: string
      example: 将领
    key:
      type: string
      example: resourceProduction.wood
    value:
      type: number
      example: 0.1
    mode:
      type: string
      example: percentAdd
MapTarget:
  type: object
  required:
  - id
  - type
  - level
  - power
  - rewards
  properties:
    id:
      type: string
      example: target-001
    type:
      type: string
      example: bandit_camp
    level:
      type: integer
      example: 1
    power:
      type: integer
      example: 100
    rewards:
      type: object
      additionalProperties:
        type: integer
BattleReport:
  type: object
  properties:
    id:
      type: string
    targetId:
      type: string
    result:
      type: string
    playerPower:
      type: integer
    enemyPower:
      type: integer
    lostUnits:
      type: object
      additionalProperties:
        type: integer
    rewards:
      type: object
      additionalProperties:
        type: integer
    createdAt:
      type: string
      format: date-time
BattleReportPage:
  type: object
  required:
  - reports
  - page
  - pageSize
  - total
  properties:
    reports:
      type: array
      items:
        $ref: '#/components/schemas/BattleReport'
    page:
      type: integer
      example: 1
    pageSize:
      type: integer
      example: 10
    total:
      type: integer
      description: 符合条件的战报总数。
      example: 23
BalanceConfig:
  type: object
  required:
  - baseProduction
  - buildings
  properties:
    baseProduction:
      type: object
      additionalProperties:
        type: integer
      example:
        wood: 30
        stone: 30
        iron: 20
        food: 40
    buildings:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/BuildingConfig'
BuildingConfig:
  type: object
  required:
  - type
  - name
  properties:
    type:
      type: string
      example: wood_camp
    name:
      type: string
      example: 伐木场
    resourceType:
      type: string
      example: wood
    productionByLevel:
      type: array
      items:
        type: integer
      example:
      - 0
      - 18
      - 36
      - 54
    capacityByLevel:
      type: array
      items:
        type: integer
      example:
      - 5000
      - 7500
      - 10000
    upgradeCostByLevel:
      type: object
      additionalProperties:
        type: object
        additionalProperties:
          type: integer
      example:
        '1':
          wood: 50
          stone: 80
          iron: 30
          food: 20
    goldUpgradeCostByLevel:
      type: object
      additionalProperties:
        type: integer
      example:
        '1': 12
        '2': 14
    upgradeSecondsByLevel:
      type: object
      additionalProperties:
        type: integer
      example:
        '1': 30
        '2': 45
