WorldPosition:
  type: object
  required:
  - playerId
  - worldId
  - x
  - y
  - assignedBy
  properties:
    playerId:
      type: string
    worldId:
      type: string
      example: world_1
    x:
      type: integer
      minimum: 0
      maximum: 99
    y:
      type: integer
      minimum: 0
      maximum: 99
    assignedBy:
      type: string
      enum: [create, migration, lazy_create, admin, relocate, test]
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
WorldMapOccupancyStats:
  type: object
  required:
  - worldId
  - width
  - height
  - totalCells
  - occupiedCells
  - availableCells
  - occupancyRate
  properties:
    worldId:
      type: string
      example: world_1
    width:
      type: integer
      example: 100
    height:
      type: integer
      example: 100
    totalCells:
      type: integer
      example: 10000
    occupiedCells:
      type: integer
      example: 123
    availableCells:
      type: integer
      example: 9877
    occupancyRate:
      type: number
      format: double
      example: 0.0123
WorldMapCoordinateCheck:
  type: object
  required:
  - worldId
  - x
  - y
  - occupied
  properties:
    worldId:
      type: string
      example: world_1
    x:
      type: integer
      minimum: 0
      maximum: 99
    y:
      type: integer
      minimum: 0
      maximum: 99
    occupied:
      type: boolean
      description: 该格是否已有玩家城池。
    playerId:
      type: string
      description: 已占用时返回占用该格的玩家 ID。
WorldMapTarget:
  type: object
  required:
  - targetType
  - targetId
  - name
  - faction
  - relation
  - level
  - status
  - x
  - y
  - distance
  - direction
  - canScout
  - canAttack
  - canPlunder
  - canReinforce
  properties:
    targetType:
      type: string
      example: player_city
    targetId:
      type: string
    playerId:
      type: string
    name:
      type: string
    faction:
      type: string
      example: shu
    relation:
      type: string
      enum: [self, ally, other]
    level:
      type: integer
    status:
      type: string
      enum: [self, ally, normal, protected, truce, attackable, unavailable]
    x:
      type: integer
      minimum: 0
      maximum: 99
    y:
      type: integer
      minimum: 0
      maximum: 99
    distance:
      type: integer
      minimum: 0
    direction:
      type: string
      example: 东南
    canScout:
      type: boolean
    canAttack:
      type: boolean
    canPlunder:
      type: boolean
    canReinforce:
      type: boolean
    reason:
      type: string
    scoutReason:
      type: string
    attackReason:
      type: string
    plunderReason:
      type: string
    reinforceReason:
      type: string
WorldMapViewResponse:
  type: object
  required:
  - worldId
  - width
  - height
  - self
  - centerX
  - centerY
  - radius
  - targets
  - serverTime
  properties:
    worldId:
      type: string
      example: world_1
    width:
      type: integer
      example: 100
    height:
      type: integer
      example: 100
    self:
      $ref: '#/components/schemas/WorldPosition'
    centerX:
      type: integer
    centerY:
      type: integer
    radius:
      type: integer
    targets:
      type: array
      items:
        $ref: '#/components/schemas/WorldMapTarget'
    serverTime:
      type: string
      format: date-time
WorldMapMigrationResult:
  type: object
  required:
  - total
  - created
  - skipped
  - conflicts
  - failed
  properties:
    total:
      type: integer
    created:
      type: integer
    skipped:
      type: integer
    conflicts:
      type: integer
      description: 旧坐标被占用后改分配到附近空格的玩家数量。
    conflictDetails:
      type: array
      description: '旧坐标冲突玩家的迁移明细，格式为 playerId: (oldX,oldY) -> (newX,newY)。'
      items:
        type: string
    failed:
      type: integer
    failures:
      type: array
      items:
        type: string
NpcState:
  type: object
  required:
  - cities
  - lastRefreshedAt
  properties:
    cities:
      type: array
      items:
        $ref: '#/components/schemas/NpcCity'
    lastRefreshedAt:
      type: string
      format: date-time
      description: 本轮 NPC 城池生成或刷新时间。
NpcCity:
  type: object
  required:
  - id
  - name
  - faction
  - tier
  - resources
  - storageCapacity
  - productionPerHour
  - army
  - maxArmy
  - armyRecoveryRate
  - recoveryProfile
  - traits
  - resourceSettledAt
  - armySettledAt
  - generatedAt
  properties:
    id:
      type: string
      example: npc_a1b2c3d4
    name:
      type: string
      example: 黑山营寨
    faction:
      type: string
      enum:
      - wei
      - shu
      - wu
      example: wei
    tier:
      type: string
      enum:
      - small
      - medium
      - large
      - golden
      example: medium
    resources:
      type: object
      additionalProperties:
        type: integer
      example:
        wood: 50000
        stone: 50000
        iron: 50000
        food: 50000
    storageCapacity:
      type: object
      additionalProperties:
        type: integer
      example:
        wood: 320000
        stone: 320000
        iron: 320000
        food: 320000
    productionPerHour:
      type: object
      additionalProperties:
        type: integer
      example:
        wood: 24500
        stone: 24500
        iron: 24500
        food: 24500
    army:
      type: array
      items:
        $ref: '#/components/schemas/ArmyUnit'
    maxArmy:
      type: array
      items:
        $ref: '#/components/schemas/ArmyUnit'
    armyRecoveryRate:
      type: number
      format: double
      description: 每小时恢复守军总量。
      example: 12.5
    recoveryProfile:
      type: string
      example: normal
    traits:
      type: array
      items:
        $ref: '#/components/schemas/NpcTrait'
    resourceSettledAt:
      type: string
      format: date-time
    armySettledAt:
      type: string
      format: date-time
    generatedAt:
      type: string
      format: date-time
NpcTrait:
  type: object
  required:
  - id
  - name
  - buffs
  properties:
    id:
      type: string
      example: rich
    name:
      type: string
      example: 富矿
    buffs:
      type: object
      additionalProperties:
        type: number
      example:
        resourceMultiplier: 1.2
NpcCitiesRefreshRequest:
  type: object
  required:
  - playerId
  properties:
    playerId:
      type: string
      example: player_47f23e0eeb08ab50402fedfc
AttackNpcRequest:
  type: object
  required:
  - playerId
  - npcId
  - units
  properties:
    playerId:
      type: string
      example: player_47f23e0eeb08ab50402fedfc
    npcId:
      type: string
      example: npc_a1b2c3d4
    mode:
      type: string
      enum:
      - attack
      - plunder
      default: attack
      description: attack 为攻城，plunder 为掠夺。
    units:
      type: object
      description: 出征兵力，key 为兵种 ID，value 为数量。
      additionalProperties:
        type: integer
        minimum: 1
      example:
        infantry: 50
        cavalry: 20
    generalIds:
      type: array
      maxItems: 1
      description: 本次出征携带的参战武将 ID，最多 1 个；为空表示不带武将，不享受武将加成也不获得武将经验。
      items:
        type: string
AttackNpcResponse:
  type: object
  required:
  - battleReport
  - resources
  - army
  - cityGold
  - serverTime
  properties:
    battleReport:
      $ref: '#/components/schemas/BattleReport'
    resources:
      $ref: '#/components/schemas/ResourceState'
    army:
      type: array
      items:
        $ref: '#/components/schemas/ArmyUnit'
    general:
      $ref: '#/components/schemas/General'
    generals:
      type: array
      items:
        $ref: '#/components/schemas/General'
    cityGold:
      type: integer
      example: 120
    npcState:
      $ref: '#/components/schemas/NpcState'
    serverTime:
      type: string
      format: date-time
SweepNpcRequest:
  type: object
  required:
  - playerId
  - npcIds
  properties:
    playerId:
      type: string
      example: player_47f23e0eeb08ab50402fedfc
    npcIds:
      type: array
      minItems: 1
      maxItems: 50
      description: 按顺序扫荡的 NPC 城池 ID。后台任务会完整处理请求中的目标，内部按批量事务结算；单次最多 50 个目标。
      items:
        type: string
      example:
      - npc_a1b2c3d4
      - npc_b2c3d4e5
    mode:
      type: string
      enum:
      - attack
      - plunder
      default: attack
      description: attack 为攻城，plunder 为掠夺。
    generalIds:
      type: array
      maxItems: 1
      description: 本次扫荡携带的参战武将 ID，最多 1 个；为空表示不带武将。
      items:
        type: string
SweepNpcResponse:
  type: object
  required:
  - battleReport
  - done
  - failed
  - stopped
  - resources
  - army
  - cityGold
  - serverTime
  properties:
    battleReport:
      $ref: '#/components/schemas/BattleReport'
    done:
      type: integer
      description: 成功结算的 NPC 城池数量。
      example: 10
    failed:
      type: integer
      description: 结算失败并跳过的 NPC 城池数量。
      example: 0
    stopped:
      type: boolean
      description: 是否因为兵力不足或没有可用兵力提前停止。
      example: false
    resources:
      $ref: '#/components/schemas/ResourceState'
    army:
      type: array
      items:
        $ref: '#/components/schemas/ArmyUnit'
    general:
      $ref: '#/components/schemas/General'
    generals:
      type: array
      items:
        $ref: '#/components/schemas/General'
    cityGold:
      type: integer
      example: 120
    npcState:
      $ref: '#/components/schemas/NpcState'
    serverTime:
      type: string
      format: date-time
NpcSweepTask:
  type: object
  required:
  - id
  - playerId
  - npcIds
  - mode
  - status
  - requested
  - done
  - failed
  - stopped
  - createdAt
  - updatedAt
  properties:
    id:
      type: string
      example: sweep_task_abc123
    playerId:
      type: string
      example: player_47f23e0eeb08ab50402fedfc
    npcIds:
      type: array
      items:
        type: string
    mode:
      type: string
      enum:
      - attack
      - plunder
    generalIds:
      type: array
      items:
        type: string
    status:
      type: string
      enum:
      - queued
      - running
      - completed
      - failed
    requested:
      type: integer
      description: 本次任务请求扫荡的目标数量，单次最多 50 个。
    done:
      type: integer
      description: 已成功结算的目标数量。
    failed:
      type: integer
      description: 已失败或跳过的目标数量。
    stopped:
      type: boolean
      description: 是否因为兵力不足等原因提前停止。
    error:
      type: string
      description: 任务失败时的错误信息。
    result:
      $ref: '#/components/schemas/SweepNpcResponse'
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    startedAt:
      type: string
      format: date-time
    completedAt:
      type: string
      format: date-time
ScoutNpcRequest:
  type: object
  required:
  - playerId
  - npcId
  properties:
    playerId:
      type: string
      example: player_47f23e0eeb08ab50402fedfc
    npcId:
      type: string
      example: npc_a1b2c3d4
ScoutNpcResponse:
  type: object
  required:
  - success
  - npcCity
  - army
  - serverTime
  properties:
    success:
      type: boolean
      example: true
    battleReport:
      $ref: '#/components/schemas/BattleReport'
    npcCity:
      $ref: '#/components/schemas/NpcCity'
      nullable: true
    army:
      type: array
      items:
        $ref: '#/components/schemas/ArmyUnit'
    npcState:
      $ref: '#/components/schemas/NpcState'
    serverTime:
      type: string
      format: date-time
NpcConfig:
  type: object
  required:
  - baseProduction
  - baseStorage
  - refreshIntervalHours
  - manualRefreshCostGold
  - goldenAppearRate
  - totalCities
  - tiers
  - recoveryProfiles
  - traitPool
  - cityNames
  - scoutCost
  properties:
    baseProduction:
      type: integer
      minimum: 1
      example: 24500
    baseStorage:
      type: integer
      minimum: 1
      example: 320000
    refreshIntervalHours:
      type: integer
      minimum: 1
      example: 24
    manualRefreshCostGold:
      type: integer
      minimum: 0
      example: 50
    goldenAppearRate:
      type: number
      format: double
      minimum: 0
      maximum: 1
      example: 0.2
    totalCities:
      type: integer
      minimum: 1
      example: 12
    tiers:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/NpcTierConfig'
    recoveryProfiles:
      type: array
      items:
        $ref: '#/components/schemas/NpcRecoveryProfile'
    traitPool:
      type: array
      items:
        $ref: '#/components/schemas/NpcTraitConfig'
    cityNames:
      type: array
      items:
        type: string
      example:
      - 洛阳
      - 长安
      - 成都
    scoutCost:
      type: object
      additionalProperties:
        type: integer
      example:
        small: 5
        medium: 15
        large: 30
        golden: 50
NpcTierConfig:
  type: object
  required:
  - multiplier
  - armyRange
  - armyTypes
  - traitCount
  - count
  properties:
    multiplier:
      type: number
      format: double
      minimum: 0
      exclusiveMinimum: true
    armyRange:
      $ref: '#/components/schemas/IntRange'
    armyTypes:
      $ref: '#/components/schemas/IntRange'
    traitCount:
      $ref: '#/components/schemas/IntRange'
    count:
      $ref: '#/components/schemas/NpcCountRule'
IntRange:
  type: object
  required:
  - min
  - max
  properties:
    min:
      type: integer
    max:
      type: integer
NpcCountRule:
  type: object
  required:
  - guaranteed
  - weight
  properties:
    guaranteed:
      type: integer
      minimum: 0
    weight:
      type: integer
      minimum: 0
NpcRecoveryProfile:
  type: object
  required:
  - id
  - name
  - armyMultiplier
  - resourceMultiplier
  - weight
  properties:
    id:
      type: string
    name:
      type: string
    armyMultiplier:
      type: number
      format: double
    resourceMultiplier:
      type: number
      format: double
    weight:
      type: integer
      minimum: 0
NpcTraitConfig:
  type: object
  required:
  - id
  - name
  - buffs
  - weight
  properties:
    id:
      type: string
    name:
      type: string
    buffs:
      type: object
      additionalProperties:
        type: number
    weight:
      type: integer
      minimum: 0
