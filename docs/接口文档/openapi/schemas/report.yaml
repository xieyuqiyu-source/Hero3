BattleReport:
  type: object
  description: 标准战报，兼容旧字段并优先提供 detail 标准详情结构。
  properties:
    id:
      type: string
    eventId:
      type: string
    playerId:
      type: string
    ownerPlayerId:
      type: string
    viewType:
      type: string
      enum: [attack, defense, reinforcement, scout, system]
    sourceType:
      type: string
      enum: [npc_city, player_city, stronghold, dungeon, resource_point, alliance, event_target, world_boss, system]
    battleType:
      type: string
    title:
      type: string
    summary:
      type: string
    result:
      type: string
    targetId:
      type: string
    targetName:
      type: string
    detail:
      $ref: '#/components/schemas/BattleReportDetail'
    drops:
      type: array
      description: 本场战斗直接掉落的物品快照，名称和品质用于战报高亮展示。
      items:
        $ref: '#/components/schemas/BattleReportDrop'
    share:
      $ref: '#/components/schemas/BattleReportShareLink'
    read:
      type: boolean
    createdAt:
      type: string
      format: date-time
BattleReportPage:
  type: object
  required: [reports, page, pageSize, total]
  properties:
    reports:
      type: array
      items:
        $ref: '#/components/schemas/BattleReport'
    page:
      type: integer
      example: 1
    pageSize:
      type: integer
      example: 10
    total:
      type: integer
      example: 23
BattleEvent:
  type: object
  description: 一次真实发生的战斗或侦查事件，可关联多份玩家视角战报。
  properties:
    id:
      type: string
    sourceType:
      type: string
    sourceId:
      type: string
    scene:
      type: string
    battleType:
      type: string
    result:
      type: string
    attackerPlayerId:
      type: string
    defenderPlayerId:
      type: string
    attackerName:
      type: string
    defenderName:
      type: string
    attackerFaction:
      type: string
    defenderFaction:
      type: string
    relatedMarchId:
      type: string
    relatedReinforcementId:
      type: string
    summary:
      type: object
      additionalProperties: true
    snapshot:
      type: object
      additionalProperties: true
    resultData:
      type: object
      additionalProperties: true
    occurredAt:
      type: string
      format: date-time
    createdAt:
      type: string
      format: date-time
BattleEventPage:
  type: object
  required: [items, page, pageSize, total]
  properties:
    items:
      type: array
      items:
        $ref: '#/components/schemas/BattleEvent'
    page:
      type: integer
    pageSize:
      type: integer
    total:
      type: integer
BattleReportDetail:
  type: object
  required: [id, viewType, sourceType, battleType, result, title, occurredAt, primarySide, rewards, visibility, read]
  properties:
    id:
      type: string
    eventId:
      type: string
    ownerPlayerId:
      type: string
    viewType:
      type: string
    viewLabel:
      type: string
    sourceType:
      type: string
    sourceLabel:
      type: string
    battleType:
      type: string
    result:
      type: string
    title:
      type: string
    summary:
      type: string
    occurredAt:
      type: string
      format: date-time
    primarySide:
      $ref: '#/components/schemas/BattleReportSide'
    secondarySide:
      nullable: true
      allOf:
      - $ref: '#/components/schemas/BattleReportSide'
    rewards:
      $ref: '#/components/schemas/BattleReportRewards'
    traits:
      type: array
      items:
        $ref: '#/components/schemas/BattleReportTrait'
    visibility:
      $ref: '#/components/schemas/BattleReportVisibility'
    extra:
      type: object
      additionalProperties: true
    read:
      type: boolean
    share:
      $ref: '#/components/schemas/BattleReportShareLink'
BattleReportSide:
  type: object
  properties:
    role:
      type: string
    playerId:
      type: string
    playerName:
      type: string
    cityName:
      type: string
    faction:
      type: string
    factionLabel:
      type: string
    targetType:
      type: string
    targetId:
      type: string
    targetName:
      type: string
    power:
      type: integer
    generals:
      type: array
      items:
        $ref: '#/components/schemas/BattleReportGeneral'
    units:
      type: array
      items:
        $ref: '#/components/schemas/BattleReportUnit'
    resources:
      type: object
      additionalProperties:
        type: integer
BattleReportUnit:
  type: object
  properties:
    unitType:
      type: string
    unitName:
      type: string
    faction:
      type: string
    amountBefore:
      type: integer
    dispatched:
      type: integer
    lost:
      type: integer
    survived:
      type: integer
BattleReportGeneral:
  type: object
  properties:
    id:
      type: string
    name:
      type: string
    level:
      type: integer
    role:
      type: string
    power:
      type: integer
BattleReportTrait:
  type: object
  properties:
    traitId:
      type: string
    traitName:
      type: string
    ownerSide:
      type: string
    ownerRole:
      type: string
    generalId:
      type: string
    generalName:
      type: string
    summary:
      type: string
    detail:
      type: object
      additionalProperties: true
BattleReportRewards:
  type: object
  properties:
    resources:
      type: object
      additionalProperties:
        type: integer
    drops:
      type: array
      items:
        $ref: '#/components/schemas/BattleReportDrop'
    cityGold:
      type: integer
    generalExp:
      type: integer
    generalLevelBefore:
      type: integer
    generalLevelAfter:
      type: integer
    overflow:
      type: object
      additionalProperties:
        type: integer
BattleReportDrop:
  type: object
  properties:
    type:
      type: string
    itemId:
      type: string
    name:
      type: string
    amount:
      type: integer
    quality:
      type: string
BattleReportVisibility:
  type: object
  properties:
    showEnemyRemainingUnits:
      type: boolean
    showEnemyResources:
      type: boolean
    showEnemyGenerals:
      type: boolean
    showEnemyCityDefense:
      type: boolean
    reason:
      type: string
    threshold:
      type: number
    actualLossRatio:
      type: number
BattleReportShareLink:
  type: object
  properties:
    id:
      type: string
    reportId:
      type: string
    token:
      type: string
    visibility:
      type: string
    expiresAt:
      type: string
      format: date-time
    createdAt:
      type: string
      format: date-time
BattleReportParticipant:
  type: object
  description: GM 排查用的战斗事件参与方快照。
  properties:
    id:
      type: string
    eventId:
      type: string
    reportId:
      type: string
    playerId:
      type: string
    role:
      type: string
    faction:
      type: string
    nickname:
      type: string
    cityName:
      type: string
    troopsBefore:
      type: object
      additionalProperties:
        type: integer
    troopsLost:
      type: object
      additionalProperties:
        type: integer
    troopsSurvived:
      type: object
      additionalProperties:
        type: integer
    generals:
      type: array
      items:
        $ref: '#/components/schemas/BattleReportGeneral'
    rewards:
      $ref: '#/components/schemas/BattleReportRewards'
    pointsDelta:
      type: object
      additionalProperties:
        type: integer
    extra:
      type: object
      additionalProperties: true
    createdAt:
      type: string
      format: date-time
