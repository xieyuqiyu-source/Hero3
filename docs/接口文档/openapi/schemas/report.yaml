BattleReport:
  type: object
  description: 标准战报，兼容旧字段并优先提供 detail 标准详情结构。
  properties:
    id:
      type: string
    eventId:
      type: string
    playerId:
      type: string
    ownerPlayerId:
      type: string
    playerFaction:
      type: string
      description: 兼容字段，战报所有者阵营；防守视角中对应守城方。
    playerName:
      type: string
      description: 兼容字段，战报所有者名称；防守视角中对应守城方。
    playerPower:
      type: integer
      description: 兼容字段，战报所有者本场战力。
    viewType:
      type: string
      enum: [attack, defense, reinforcement, scout, system]
    sourceType:
      type: string
      enum: [npc_city, player_city, yellow_turban, stronghold, dungeon, resource_point, alliance, event_target, world_boss, system]
    battleType:
      type: string
    winnerSide:
      type: string
      enum: [attacker, defender, draw, none]
    ownerSide:
      type: string
      enum: [attacker, defender, reinforcement, scout, observer]
    ownerOutcome:
      type: string
      enum: [victory, defeat, draw, intel_success, intel_failed, notice]
    title:
      type: string
    summary:
      type: string
    result:
      type: string
    targetId:
      type: string
    targetName:
      type: string
    defenderFaction:
      type: string
      description: 兼容字段，战报目标阵营；防守视角中对应来袭方。
    enemyPower:
      type: integer
      description: 兼容字段，战报目标本场战力。
    dispatchedUnits:
      type: object
      description: 兼容字段，本场出动兵力。
      additionalProperties:
        type: integer
    lostUnits:
      type: object
      description: 兼容字段，本场或聚合战斗累计阵亡兵力。
      additionalProperties:
        type: integer
    survivedUnits:
      type: object
      description: 战后实际存活或归队兵力；复活、最终减损和扫荡聚合场景应优先使用该值。
      additionalProperties:
        type: integer
    defenderUnits:
      type: object
      description: 兼容字段，战报目标本场出动兵力；防守视角中对应来袭方。
      additionalProperties:
        type: integer
    defenderLostUnits:
      type: object
      description: 兼容字段，战报目标本场损失。
      additionalProperties:
        type: integer
    defenderResources:
      type: object
      description: 兼容字段，按情报可见性保存的战报目标资源快照。
      additionalProperties:
        type: integer
    defenderRevealed:
      type: boolean
      description: 兼容字段，目标兵力、资源、将领和城墙是否已向战报所有者揭示。
    rewards:
      type: object
      description: 兼容字段，本场实际获得或掠夺的资源。
      additionalProperties:
        type: integer
    overflow:
      type: object
      description: 兼容字段，超出容量未能获得的资源。
      additionalProperties:
        type: integer
    overflowCityGold:
      type: integer
      description: 兼容字段，本场实际获得的城金。
    revivedUnits:
      type: object
      description: 战后复活或通过最终减损返还的逐兵种数量。
      additionalProperties:
        type: integer
    traitTriggered:
      type: array
      description: 兼容字段，按真实触发顺序保存特性结果的存储键；展示名称应读取对应结果的 traitId。
      items:
        type: string
    traitOutcomes:
      type: object
      description: 兼容字段，按存储键保存每条真实特性结果；同一特性可因触发者不同出现多条。
      additionalProperties:
        $ref: '#/components/schemas/TraitOutcomeReport'
    generalExpGained:
      type: integer
      description: 当前战报拥有者的参战武将在本场实际获得的经验。
    generalLevelBefore:
      type: integer
      description: 当前战报拥有者的参战武将战前等级。
    generalLevelAfter:
      type: integer
      description: 当前战报拥有者的参战武将战后等级。
    pvpAttackerGenerals:
      type: array
      description: 兼容字段，本场进攻方将领快照；不等同于真实触发时间线。
      items:
        $ref: '#/components/schemas/BattleReportGeneral'
    pvpDefenderGenerals:
      type: array
      description: 兼容字段，本场防守方将领快照；不等同于真实触发时间线。
      items:
        $ref: '#/components/schemas/BattleReportGeneral'
    pvpReinforcements:
      type: array
      description: 本场实际参战的逐批援军快照，包含后端权威经验和等级变化。
      items:
        $ref: '#/components/schemas/BattleReportReinforcementSnapshot'
    pvpReinforcementLosses:
      type: object
      description: 按增援批次 ID 和兵种 ID 保存的本场实际损失。
      additionalProperties:
        type: object
        additionalProperties:
          type: integer
    pvpWall:
      type: object
      description: 兼容字段，本场防守方城墙的后端权威快照；前端不得自行重算。
      properties:
        faction:
          type: string
        level:
          type: integer
        base:
          type: number
        multiplier:
          type: number
        factionDefenseBonus:
          type: number
        totalDefenseBonus:
          type: number
        hardness:
          type: number
        minDamagedLevelFrom20:
          type: integer
        maxDamagedLevelFrom20:
          type: integer
    detail:
      $ref: '#/components/schemas/BattleReportDetail'
    drops:
      type: array
      description: 本场战斗直接掉落的物品快照，名称和品质用于战报高亮展示。
      items:
        $ref: '#/components/schemas/BattleReportDrop'
    share:
      $ref: '#/components/schemas/BattleReportShareLink'
    read:
      type: boolean
    createdAt:
      type: string
      format: date-time
BattleReportPage:
  type: object
  required: [reports, page, pageSize, total]
  properties:
    reports:
      type: array
      items:
        $ref: '#/components/schemas/BattleReport'
    page:
      type: integer
      example: 1
    pageSize:
      type: integer
      example: 10
    total:
      type: integer
      example: 23
TraitOutcomeReport:
  type: object
  required: [traitId]
  properties:
    traitId:
      type: string
      description: 正式特性 ID，不一定等于 traitOutcomes 的内部存储键。
    name:
      type: string
    traitType:
      type: string
    ownerSide:
      type: string
      enum: [attacker, defender, reinforcement]
    ownerGeneralId:
      type: string
    ownerPlayerId:
      type: string
      description: 特性触发玩家；多名援军使用同一将领时用于精确归属。
    scope:
      type: string
    detail:
      type: object
      additionalProperties: true
BattleReportEventContext:
  type: object
  required: [event, reports, participants]
  properties:
    event:
      $ref: '#/components/schemas/BattleEvent'
    reports:
      type: array
      items:
        $ref: '#/components/schemas/BattleReport'
    participants:
      type: array
      items:
        $ref: '#/components/schemas/BattleReportParticipant'
BattleEvent:
  type: object
  description: 一次真实发生的战斗或侦查事件，可关联多份玩家视角战报。
  properties:
    id:
      type: string
    sourceType:
      type: string
    sourceId:
      type: string
    scene:
      type: string
    battleType:
      type: string
    result:
      type: string
    attackerPlayerId:
      type: string
    defenderPlayerId:
      type: string
    attackerName:
      type: string
    defenderName:
      type: string
    attackerFaction:
      type: string
    defenderFaction:
      type: string
    relatedMarchId:
      type: string
    relatedReinforcementId:
      type: string
    summary:
      type: object
      additionalProperties: true
    snapshot:
      type: object
      additionalProperties: true
    resultData:
      type: object
      additionalProperties: true
    occurredAt:
      type: string
      format: date-time
    createdAt:
      type: string
      format: date-time
BattleEventPage:
  type: object
  required: [items, page, pageSize, total]
  properties:
    items:
      type: array
      items:
        $ref: '#/components/schemas/BattleEvent'
    page:
      type: integer
    pageSize:
      type: integer
    total:
      type: integer
BattleReportDetail:
  type: object
  required: [id, viewType, sourceType, battleType, result, title, occurredAt, primarySide, rewards, visibility, read]
  properties:
    id:
      type: string
    eventId:
      type: string
    ownerPlayerId:
      type: string
    viewType:
      type: string
    viewLabel:
      type: string
    sourceType:
      type: string
    sourceLabel:
      type: string
    battleType:
      type: string
    result:
      type: string
    winnerSide:
      type: string
      enum: [attacker, defender, draw, none]
    ownerSide:
      type: string
      enum: [attacker, defender, reinforcement, scout, observer]
    ownerOutcome:
      type: string
      enum: [victory, defeat, draw, intel_success, intel_failed, notice]
    title:
      type: string
    summary:
      type: string
    occurredAt:
      type: string
      format: date-time
    primarySide:
      $ref: '#/components/schemas/BattleReportSide'
    secondarySide:
      nullable: true
      allOf:
      - $ref: '#/components/schemas/BattleReportSide'
    rewards:
      $ref: '#/components/schemas/BattleReportRewards'
    traits:
      type: array
      items:
        $ref: '#/components/schemas/BattleReportTrait'
    visibility:
      $ref: '#/components/schemas/BattleReportVisibility'
    extra:
      $ref: '#/components/schemas/BattleReportExtra'
    read:
      type: boolean
    share:
      $ref: '#/components/schemas/BattleReportShareLink'
BattleReportSide:
  type: object
  properties:
    role:
      type: string
    playerId:
      type: string
    playerName:
      type: string
    cityName:
      type: string
    faction:
      type: string
    factionLabel:
      type: string
    targetType:
      type: string
    targetId:
      type: string
    targetName:
      type: string
    power:
      type: integer
    generals:
      type: array
      items:
        $ref: '#/components/schemas/BattleReportGeneral'
    units:
      type: array
      items:
        $ref: '#/components/schemas/BattleReportUnit'
    resources:
      type: object
      additionalProperties:
        type: integer
BattleReportUnit:
  type: object
  properties:
    unitType:
      type: string
    unitName:
      type: string
    faction:
      type: string
    amountBefore:
      type: integer
    dispatched:
      type: integer
    lost:
      type: integer
    survived:
      type: integer
BattleReportGeneral:
  type: object
  properties:
    id:
      type: string
    name:
      type: string
    level:
      type: integer
    role:
      type: string
    power:
      type: integer
    generalExpGained:
      type: integer
      description: 该参战将领在本场战斗实际获得的经验；与查看战报的玩家视角无关。
    generalLevelBefore:
      type: integer
      description: 该参战将领结算经验前的等级。
    generalLevelAfter:
      type: integer
      description: 该参战将领结算经验后的等级。
    stats:
      type: object
      additionalProperties:
        type: integer
    effectiveStats:
      type: object
      description: 包含被动特性加成后的本场最终四维快照。
      additionalProperties:
        type: integer
    attributes:
      type: object
      additionalProperties:
        type: number
    buffs:
      type: object
      additionalProperties:
        type: number
    traits:
      type: array
      description: 参战将领拥有的特性快照，不等同于本场实际触发时间线。
      items:
        $ref: '#/components/schemas/GeneralTraitInstance'
BattleReportTrait:
  type: object
  properties:
    traitId:
      type: string
    traitName:
      type: string
    ownerSide:
      type: string
    ownerRole:
      type: string
    ownerPlayerId:
      type: string
    generalId:
      type: string
    generalName:
      type: string
    summary:
      type: string
    detail:
      type: object
      additionalProperties: true
BattleReportRewards:
  type: object
  properties:
    resources:
      type: object
      additionalProperties:
        type: integer
    drops:
      type: array
      items:
        $ref: '#/components/schemas/BattleReportDrop'
    cityGold:
      type: integer
    generalExp:
      type: integer
    generalLevelBefore:
      type: integer
    generalLevelAfter:
      type: integer
    overflow:
      type: object
      additionalProperties:
        type: integer
BattleReportDrop:
  type: object
  properties:
    type:
      type: string
    itemId:
      type: string
    name:
      type: string
    amount:
      type: integer
    quality:
      type: string
BattleReportVisibility:
  type: object
  properties:
    showEnemyRemainingUnits:
      type: boolean
    showEnemyResources:
      type: boolean
    showEnemyGenerals:
      type: boolean
    showEnemyCityDefense:
      type: boolean
    reason:
      type: string
    threshold:
      type: number
    actualLossRatio:
      type: number
BattleReportExtra:
  type: object
  description: 玩法上下文扩展。新 UI 只读取这里的结构化上下文，未知字段保持透传。
  additionalProperties: true
  properties:
    sweep:
      $ref: '#/components/schemas/BattleReportSweepExtra'
    scout:
      $ref: '#/components/schemas/BattleReportScoutExtra'
    reinforcement:
      $ref: '#/components/schemas/BattleReportReinforcementExtra'
    yellowTurban:
      $ref: '#/components/schemas/BattleReportYellowTurbanExtra'
    dungeon:
      $ref: '#/components/schemas/BattleReportDungeonExtra'
    pvp:
      $ref: '#/components/schemas/BattleReportPvpExtra'
BattleReportPvpExtra:
  type: object
  description: PVP、黄巾防守和协防共用的参战快照；兵力固定表示战斗开始时的出动数量。
  properties:
    reinforcements:
      type: array
      items:
        $ref: '#/components/schemas/BattleReportReinforcementSnapshot'
    reinforcementLosses:
      type: object
      additionalProperties:
        type: object
        additionalProperties:
          type: integer
    pointsDelta:
      type: object
      additionalProperties:
        type: integer
    wall:
      type: object
      additionalProperties: true
BattleReportReinforcementSnapshot:
  type: object
  properties:
    reinforcementId:
      type: string
    fromPlayerId:
      type: string
    fromPlayerName:
      type: string
    faction:
      type: string
    troops:
      type: object
      description: 本场战斗开始时实际出动的增援兵力。
      additionalProperties:
        type: integer
    generals:
      type: array
      items:
        $ref: '#/components/schemas/ReinforcementGeneralSnapshot'
    generalExpGained:
      type: integer
      description: 该批增援携带武将在本场实际获得的经验。
    generalLevelBefore:
      type: integer
      description: 该批增援携带武将的本场战前等级，由服务端按累计经验基线计算。
    generalLevelAfter:
      type: integer
      description: 该批增援携带武将的本场战后等级，由服务端结算，前端不得自行推算。
    buffs:
      type: array
      items:
        type: object
        additionalProperties: true
    sourceTags:
      type: object
      additionalProperties:
        type: string
BattleReportSweepExtra:
  type: object
  properties:
    requested:
      type: integer
    success:
      type: integer
    failed:
      type: integer
    stopped:
      type: boolean
    mode:
      type: string
    detailMode:
      type: string
      enum: [lightweight, full]
    defenders:
      type: array
      items:
        $ref: '#/components/schemas/BattleReportSweepDefender'
BattleReportSweepDefender:
  type: object
  properties:
    targetId:
      type: string
    targetName:
      type: string
    faction:
      type: string
    factionLabel:
      type: string
    power:
      type: integer
    result:
      type: string
    defenderRevealed:
      type: boolean
    units:
      type: array
      items:
        $ref: '#/components/schemas/BattleReportUnit'
    resources:
      type: object
      additionalProperties:
        type: integer
BattleReportScoutExtra:
  type: object
  properties:
    success:
      type: boolean
    scoutUnitType:
      type: string
    scoutSent:
      type: integer
    scoutLost:
      type: integer
    scoutReturned:
      type: integer
    counterScoutUnitType:
      type: string
    counterScoutLost:
      type: integer
    revealResources:
      type: boolean
    revealUnits:
      type: boolean
    reason:
      type: string
BattleReportReinforcementExtra:
  type: object
  properties:
    reinforcementId:
      type: string
    hostPlayerId:
      type: string
    hostPlayerName:
      type: string
    hostCityName:
      type: string
    attackerPlayerId:
      type: string
    attackerName:
      type: string
    attackerCityName:
      type: string
    battleEventId:
      type: string
    battleResult:
      type: string
    ownerContribution:
      type: object
      additionalProperties: true
BattleReportYellowTurbanExtra:
  type: object
  properties:
    marchId:
      type: string
    sourceCityId:
      type: string
    sourceCityName:
      type: string
    riskLevelId:
      type: integer
    riskLevelName:
      type: string
    currentFood:
      type: integer
    foodCapacity:
      type: integer
    foodPressure:
      type: number
    spawnMultiplier:
      type: number
BattleReportDungeonExtra:
  type: object
  properties:
    rewardMode:
      type: string
      enum: [preview, granted, settlement]
BattleReportShareLink:
  type: object
  properties:
    id:
      type: string
    reportId:
      type: string
    token:
      type: string
    visibility:
      type: string
    expiresAt:
      type: string
      format: date-time
    createdAt:
      type: string
      format: date-time
BattleReportParticipant:
  type: object
  description: GM 排查用的战斗事件参与方快照。
  properties:
    id:
      type: string
    eventId:
      type: string
    reportId:
      type: string
    playerId:
      type: string
    role:
      type: string
    faction:
      type: string
    nickname:
      type: string
    cityName:
      type: string
    troopsBefore:
      type: object
      additionalProperties:
        type: integer
    troopsLost:
      type: object
      additionalProperties:
        type: integer
    troopsSurvived:
      type: object
      additionalProperties:
        type: integer
    generals:
      type: array
      items:
        $ref: '#/components/schemas/BattleReportGeneral'
    rewards:
      $ref: '#/components/schemas/BattleReportRewards'
    pointsDelta:
      type: object
      additionalProperties:
        type: integer
    extra:
      type: object
      additionalProperties: true
    createdAt:
      type: string
      format: date-time
