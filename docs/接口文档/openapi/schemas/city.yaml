UpgradeBuildingRequest:
  type: object
  required:
  - playerId
  - buildingId
  properties:
    playerId:
      type: string
      example: player_47f23e0eeb08ab50402fedfc
    buildingId:
      type: string
      description: 建筑实例 ID
      example: wood_camp-1
AdjustResourcesRequest:
  type: object
  required:
  - playerId
  - adjustments
  properties:
    playerId:
      type: string
      example: player_47f23e0eeb08ab50402fedfc
    adjustments:
      type: object
      description: 资源调整量，正数补发，负数扣减。
      additionalProperties:
        type: integer
      example:
        wood: 5000
        iron: -200
CapacityBoostRequest:
  type: object
  required:
  - playerId
  - multiplier
  - hours
  properties:
    playerId:
      type: string
      example: player_47f23e0eeb08ab50402fedfc
    multiplier:
      type: integer
      enum: [2, 4, 8, 16]
      description: 仓库容量倍率。
      example: 4
    hours:
      type: integer
      enum: [1, 6, 12, 24]
      description: 扩容持续小时数。
      example: 6
BoostPricesResponse:
  type: object
  description: 以“倍率x_时长h”为键、城金价格为值的组合价格表。
  additionalProperties:
    type: integer
    minimum: 0
  example:
    2x_1h: 30
    4x_6h: 450
    16x_24h: 9600
CityActionResult:
  type: object
  required:
  - resources
  - resourceProduction
  - cityGold
  - serverTime
  properties:
    building:
      $ref: '#/components/schemas/Building'
    buildings:
      type: array
      items:
        $ref: '#/components/schemas/Building'
    resourceSlots:
      type: array
      items:
        $ref: '#/components/schemas/ResourceSlot'
    resources:
      $ref: '#/components/schemas/ResourceState'
    resourceProduction:
      $ref: '#/components/schemas/ResourceProduction'
    cityGold:
      type: integer
      example: 120
    activeModifiers:
      type: array
      items:
        $ref: '#/components/schemas/ModifierBreakdownItem'
    upgraded:
      type: integer
      description: 批量升级时本次成功升级的建筑数量。
      example: 3
    cost:
      type: integer
      description: 操作消耗的城金或其他数值成本。
      example: 5
    serverTime:
      type: string
      format: date-time
ResourceActionResult:
  type: object
  required:
  - resources
  - resourceProduction
  - resourceSettledAt
  - cityGold
  - serverTime
  properties:
    resources:
      $ref: '#/components/schemas/ResourceState'
    resourceProduction:
      $ref: '#/components/schemas/ResourceProduction'
    resourceSettledAt:
      type: string
      format: date-time
    productionBoost:
      type: number
      example: 2
    productionBoostEnd:
      type: string
      format: date-time
      nullable: true
    capacityBoost:
      type: number
      example: 2
    capacityBoostEnd:
      type: string
      format: date-time
      nullable: true
    activeModifiers:
      type: array
      items:
        $ref: '#/components/schemas/ModifierBreakdownItem'
    cityGold:
      type: integer
      example: 120
    cost:
      type: integer
      description: 操作消耗的城金。
      example: 5
    serverTime:
      type: string
      format: date-time
