      responses:
        '200':
          description: 保存后的天机轮转配置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotConfig'
        '400':
          description: 配置格式或内容不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
