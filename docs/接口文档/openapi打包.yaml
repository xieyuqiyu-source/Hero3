openapi: 3.0.3
info:
  title: Hero3 API
  version: 0.1.0
  description: Hero3 当前 MVP 阶段的后端接口文档，可导入 Apifox。
servers:
- url: http://localhost:8080
  description: 本地 Go 后端
- url: http://124.223.111.163:8080
  description: 服务器后端占位，部署后按实际端口调整
tags:
- name: System
  description: 服务状态
- name: Game
  description: 游戏状态
- name: Account
  description: 轻账号与存档
- name: City
  description: 城池建设
- name: Military
  description: 军事与征兵
- name: Map
  description: 地图、NPC 城池与战斗
- name: Dungeon
  description: 地图副本玩法
- name: News
  description: 军情与战报
- name: Mail
  description: 信函系统
- name: Announcement
  description: 公告系统
- name: MiniGame
  description: 万象幻境小游戏
- name: Admin
  description: GM 后台接口
paths:
  /healthz:
    get:
      tags:
      - System
      summary: 健康检查
      operationId: getHealth
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthState'
  /api/v1/meta:
    get:
      tags:
      - System
      summary: 服务元信息
      operationId: getMeta
      responses:
        '200':
          description: 服务信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaState'
  /api/v1/game/bootstrap:
    get:
      tags:
      - Game
      summary: 游戏模块启动信息
      operationId: getGameBootstrap
      responses:
        '200':
          description: 游戏模块信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapResponse'
  /api/v1/game/state:
    get:
      tags:
      - Game
      summary: 获取游戏状态
      operationId: getGameState
      parameters:
      - name: playerId
        in: query
        required: true
        description: 玩家存档 ID。
        schema:
          type: string
          example: player_47f23e0eeb08ab50402fedfc
      responses:
        '200':
          description: 游戏状态快照
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameState'
        '404':
          description: 玩家存档不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: 缺少玩家存档 ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/game/summary:
    get:
      tags:
      - Game
      summary: 获取玩家摘要视图
      operationId: getGameSummary
      parameters:
      - name: playerId
        in: query
        required: true
        description: 玩家存档 ID。
        schema:
          type: string
      responses:
        '200':
          description: 玩家摘要视图
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerSummaryView'
        '400':
          description: 缺少玩家存档 ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/city/view:
    get:
      tags:
      - City
      summary: 获取城池视图
      operationId: getCityView
      parameters:
      - name: playerId
        in: query
        required: true
        description: 玩家存档 ID。
        schema:
          type: string
      responses:
        '200':
          description: 城池、建筑和资源田视图
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityView'
        '400':
          description: 缺少玩家存档 ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/resources/view:
    get:
      tags:
      - City
      summary: 获取资源视图
      operationId: getResourceView
      parameters:
      - name: playerId
        in: query
        required: true
        description: 玩家存档 ID。
        schema:
          type: string
      responses:
        '200':
          description: 资源栏和产量视图
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceView'
        '400':
          description: 缺少玩家存档 ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/military/view:
    get:
      tags:
      - Military
      summary: 获取军事视图
      operationId: getMilitaryView
      parameters:
      - name: playerId
        in: query
        required: true
        description: 玩家存档 ID。
        schema:
          type: string
      responses:
        '200':
          description: 兵力、征兵队列和武将摘要视图
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MilitaryView'
        '400':
          description: 缺少玩家存档 ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/inventory/view:
    get:
      tags:
      - Game
      summary: 获取背包视图
      operationId: getInventoryView
      parameters:
      - name: playerId
        in: query
        required: true
        description: 玩家存档 ID。
        schema:
          type: string
      responses:
        '200':
          description: 背包视图
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryView'
        '400':
          description: 缺少玩家存档 ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/generals/view:
    get:
      tags:
      - Military
      summary: 获取武将视图
      operationId: getGeneralsView
      parameters:
      - name: playerId
        in: query
        required: true
        description: 玩家存档 ID。
        schema:
          type: string
      responses:
        '200':
          description: 武将和派驻视图
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralsView'
        '400':
          description: 缺少玩家存档 ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/accounts/register:
    post:
      tags:
      - Account
      summary: 注册轻账号
      operationId: registerAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountRequest'
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSession'
        '400':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 账号已存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/accounts/login:
    post:
      tags:
      - Account
      summary: 登录轻账号
      operationId: loginAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSession'
        '401':
          description: 账号或密码错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/accounts/{accountId}/players:
    get:
      tags:
      - Account
      summary: 查看账号绑定的存档
      operationId: listAccountPlayers
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          example: acc_958538e3bc17faf00407ddcc
      responses:
        '200':
          description: 存档列表
          content:
            application/json:
              schema:
                type: object
                required:
                - players
                properties:
                  players:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlayerSummary'
        '404':
          description: 账号不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/accounts/{accountId}:
    delete:
      tags:
      - Account
      summary: 删除账号
      description: 删除账号，同时删除该账号关联的全部云存档。
      operationId: deleteAccount
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          example: acc_958538e3bc17faf00407ddcc
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '404':
          description: 账号不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/admin/generals-config:
    get:
      tags:
      - Admin
      summary: GM 查看将领双特性配置
      operationId: adminGetGeneralsConfig
      responses:
        '200':
          description: 当前将领配置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralsConfig'
    put:
      tags:
      - Admin
      summary: GM 保存将领双特性配置
      description: 每个启用将领必须同时配置 specialTrait 和 bonusTrait，参数必须符合后端 schema 上下限。
      operationId: adminUpdateGeneralsConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeneralsConfig'
      responses:
        '200':
          description: 保存后的将领配置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralsConfig'
        '400':
          description: 配置校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/admin/general-traits:
    get:
      tags:
      - Admin
      summary: GM 查看已注册将领特性
      operationId: adminGetGeneralTraitRegistry
      responses:
        '200':
          description: 已注册特性及参数 schema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraitRegistryResponse'
  /api/v1/players/create:
    post:
      tags:
      - Account
      summary: 创建账号绑定的游戏存档
      operationId: createPlayer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlayerRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                type: object
                required:
                - playerId
                - state
                properties:
                  playerId:
                    type: string
                    example: player_47f23e0eeb08ab50402fedfc
                  state:
                    $ref: '#/components/schemas/GameState'
        '400':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 账号不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/players/{playerId}:
    delete:
      tags:
      - Account
      summary: 删除云存档
      description: 删除指定 playerId 对应的云存档，不删除账号。
      operationId: deletePlayer
      parameters:
      - name: playerId
        in: path
        required: true
        schema:
          type: string
          example: player_47f23e0eeb08ab50402fedfc
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '404':
          description: 存档不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/city/buildings/upgrade:
    post:
      tags:
      - City
      summary: 升级建筑
      description: 消耗资源发起建筑升级，升级完成前该建筑不可再次升级。
      operationId: upgradeBuilding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpgradeBuildingRequest'
      responses:
        '200':
          description: 升级已开始，返回城池相关局部状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityActionResult'
        '404':
          description: 玩家或建筑不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 建筑正在升级中
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 资源不足或已满级
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/city/buildings/upgrade-batch:
    post:
      tags:
      - City
      summary: 批量升级资源建筑
      description: 按等级从低到高依次尝试升级所有空闲资源建筑，直到资源耗尽。
      operationId: upgradeBuildingBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - playerId
              properties:
                playerId:
                  type: string
                  example: player_47f23e0eeb08ab50402fedfc
      responses:
        '200':
          description: 批量升级完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityActionResult'
        '404':
          description: 玩家不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 资源不足，无法升级任何建筑
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/city/resources/fill:
    post:
      tags:
      - City
      summary: GM 填满资源
      description: 将指定玩家的所有资源填满到仓库容量上限。
      operationId: fillResources
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - playerId
              properties:
                playerId:
                  type: string
                  example: player_47f23e0eeb08ab50402fedfc
      responses:
        '200':
          description: 资源已填满
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceActionResult'
        '404':
          description: 玩家不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/military/recruit:
    post:
      tags:
      - Military
      summary: 发起征兵
      description: 消耗资源创建征兵队列。队列到期后，后端在游戏状态结算时自动将兵力加入军队并移除该队列。
      operationId: recruitUnits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecruitRequest'
      responses:
        '200':
          description: 征兵已进入队列，返回军事相关局部状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MilitaryActionResult'
        '400':
          description: 征兵数量无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 玩家或兵种不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 征兵队列已满
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 资源不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/military/recruit/instant:
    post:
      tags:
      - Military
      summary: 极速完成征兵队列
      description: 立即完成指定征兵队列并重新计算后续队列结束时间。金币消耗暂未接入，当前用于开发和 GM 验证。
      operationId: instantCompleteRecruit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstantCompleteRecruitRequest'
      responses:
        '200':
          description: 征兵队列已完成，返回军事相关局部状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MilitaryActionResult'
        '400':
          description: 参数错误或队列不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 玩家不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/military/general/stat:
    post:
      tags:
      - Military
      summary: 将领四维加点
      operationId: allocateGeneralStat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllocateGeneralStatRequest'
      responses:
        '200':
          description: 加点成功，返回将领相关局部状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralViewActionResult'
        '400':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 玩家或将领不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 没有可用点数或属性已满
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/military/general/reset-stats:
    post:
      tags:
      - Military
      summary: 将领洗点
      description: 消耗账户金币 10 个，清空当前将领四维加点，保留将领、等级和经验，无冷却。
      operationId: resetGeneralStats
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetGeneralStatsRequest'
      responses:
        '200':
          description: 洗点成功，返回更新后的状态和账户金币余额
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralViewActionResult'
        '404':
          description: 玩家、账号或将领不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 金币不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/military/general/change:
    post:
      tags:
      - Military
      summary: 更换将领
      description: 仅允许更换当前存档阵营内的其它将领。保留等级和经验，重置四维加点。itemId 为预留换将卡消耗字段，传入时会消耗背包中 1
        个对应物品。
      operationId: changeGeneral
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeGeneralRequest'
      responses:
        '200':
          description: 换将成功，返回更新后的状态和账户金币余额
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralViewActionResult'
        '404':
          description: 玩家、将领或换将卡物品配置不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 将领不属于当前阵营、不能更换为当前将领，或换将卡库存不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/reinforcements:
    post:
      tags:
      - Military
      summary: 发起增援
      operationId: sendReinforcement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendReinforcementRequest'
      responses:
        '200':
          description: 增援已派出
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReinforcementResponse'
        '400':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 兵力不足、武将占用或驻防来源槽已满
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/reinforcements/sent:
    get:
      tags:
      - Military
      summary: 查看我派出的增援
      operationId: listSentReinforcements
      parameters:
      - name: playerId
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 我派出的增援列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReinforcementListResponse'
  /api/v1/reinforcements/received:
    get:
      tags:
      - Military
      summary: 查看我收到的增援
      operationId: listReceivedReinforcements
      parameters:
      - name: playerId
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 我收到的增援列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReinforcementListResponse'
  /api/v1/reinforcements/{reinforcementId}:
    get:
      tags:
      - Military
      summary: 查看单个增援批次
      operationId: getReinforcement
      parameters:
      - name: reinforcementId
        in: path
        required: true
        schema:
          type: string
      - name: playerId
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 增援批次详情
          content:
            application/json:
              schema:
                type: object
                required:
                - reinforcement
                properties:
                  reinforcement:
                    $ref: '#/components/schemas/Reinforcement'
  /api/v1/reinforcements/{reinforcementId}/recall:
    post:
      tags:
      - Military
      summary: 召回援军
      operationId: recallReinforcement
      parameters:
      - name: reinforcementId
        in: path
        required: true
