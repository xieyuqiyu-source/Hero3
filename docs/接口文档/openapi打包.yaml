            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    adminToken:
      type: apiKey
      in: header
      name: X-Admin-Token
  schemas:
    HealthState:
      type: object
      required:
      - status
      - service
      - version
      - environment
      - time
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: Hero3 API
        version:
          type: string
          example: 0.1.0
        environment:
          type: string
          example: development
        time:
          type: string
          format: date-time
    MetaState:
      type: object
      additionalProperties: true
      example:
        service: Hero3 API
        version: 0.1.0
        environment: development
    BootstrapResponse:
      type: object
      required:
      - gameName
      - modules
      - message
      properties:
        gameName:
          type: string
          example: Hero3
        modules:
          type: array
          items:
            type: string
          example:
          - player
          - city
          - resource
          - military
          - map
          - combat
          - save
        balance:
          $ref: '#/components/schemas/BalanceConfig'
        factions:
          type: object
          additionalProperties: true
          description: 阵营配置。
        units:
          type: object
          additionalProperties: true
          description: 兵种配置，按阵营分组。
        items:
          type: object
          additionalProperties: true
          description: 道具配置。
        combat:
          type: object
          additionalProperties: true
          description: 战斗规则配置，包含场景规则映射、阵营城墙系数和硬度预留参数。
        fishing:
          $ref: '#/components/schemas/FishingConfig'
        slot:
          $ref: '#/components/schemas/SlotConfig'
        reincarnation:
          $ref: '#/components/schemas/ReincarnationConfig'
        message:
          type: string
          example: Hero3 后端基础服务已就绪，具体玩法逻辑待接入。
    AccountRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
          example: xieyuqi
        password:
          type: string
          format: password
          example: '123456'
    AccountSession:
      type: object
      required:
      - accountId
      - username
      properties:
        accountId:
          type: string
          example: acc_958538e3bc17faf00407ddcc
        username:
          type: string
          example: xieyuqi
    CreatePlayerRequest:
      type: object
      required:
      - accountId
      - nickname
      - faction
      properties:
        accountId:
          type: string
          example: acc_958538e3bc17faf00407ddcc
        nickname:
          type: string
          example: 主公
        faction:
          type: string
          enum:
          - wei
          - shu
          - wu
          example: wei
        generalId:
          type: string
          example: caocao
    AccountSummary:
      type: object
      required:
      - id
      - username
      - createdAt
      - players
      properties:
        id:
          type: string
          example: acc_958538e3bc17faf00407ddcc
        username:
          type: string
          example: xieyuqi
        createdAt:
          type: string
          format: date-time
        players:
          type: array
          items:
            $ref: '#/components/schemas/PlayerSummary'
    PlayerSummary:
      type: object
      required:
      - id
      - nickname
      - faction
      - updatedAt
      properties:
        id:
          type: string
          example: player_47f23e0eeb08ab50402fedfc
        nickname:
          type: string
          example: 主公
        mailCode:
          type: string
          description: 玩家信函短编号，与昵称组合成 玩家昵称#编号。
          example: '482193'
        faction:
          type: string
          example: wei
        updatedAt:
          type: string
          format: date-time
    GameState:
      type: object
      required:
      - player
      - resources
      - resourceProduction
      - resourceSettledAt
      - buildings
      - army
      - recruitQueues
      - mapTargets
      - recentBattleReports
      - unreadMessageCount
      - unreadMailCount
      - serverTime
      properties:
        player:
          $ref: '#/components/schemas/Player'
        resources:
          $ref: '#/components/schemas/ResourceState'
        inventory:
          type: object
          description: 玩家背包快照，key 为道具 ID。
          additionalProperties:
            $ref: '#/components/schemas/ItemStack'
        resourceProduction:
