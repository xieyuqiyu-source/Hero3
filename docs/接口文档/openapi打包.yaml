  /api/v1/minigame/slot/resolve:
    post:
      tags:
      - MiniGame
      summary: 结算一局天机轮转
      description: 后端校验押注兵种和单次押注，固定结算 5 条中奖线，但本局只扣除一次押注；不设置额外押注上限，只有当前兵力不足支付本局押注时拒绝。服务器生成
        3x3 图案、赔付线、免费旋转、宝匣奖励和满天星奖励，并写入一条 slot 小游戏记录。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - playerId
              - betUnitType
              - lineBet
              properties:
                playerId:
                  type: string
                betUnitType:
                  type: string
                  description: 押注兵种 ID。
                  example: qiQiYing
                lineBet:
                  type: integer
                  description: 单次押注；历史字段名保留为 lineBet，本局实际扣除与 lineBet 相同。
                  minimum: 1000
                  example: 10000
      responses:
        '200':
          description: 结算成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotRoundResult'
        '404':
          description: 存档不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 押注兵种不存在、押注不足、兵力不足或兵种不能押注
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 同一存档操作过快
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
